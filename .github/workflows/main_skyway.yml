name: Trigger auto deployment for skyway

on:
  push:
    branches: 
      - main
    paths:
      - '**'
      - '.github/workflows/skyway-AutoDeployTrigger-dd645f93-53cd-4ee1-9537-1ae08ce6778e.yml'

  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SKYWAY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SKYWAY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SKYWAY_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: skyway
          resourceGroup: skyWay
          dockerfilePath: Dockerfile
          imageToBuild: default/skyway:${{ github.sha }}
