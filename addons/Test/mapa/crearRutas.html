    // ------------------------------

    const map = L.map('map').setView([20,0],2);

    // Variables de ruta
    // ------------------------------
    let ruta = [];
    let listaRuta = document.getElementById("listaRuta");
    let rutaLayer = null;
    let infoDiv = document.getElementById("info");

    // ------------------------------
    // Marcadores
    // ------------------------------
    aeropuertos.forEach(a=>{
        const marker = L.marker(a.coords).addTo(map);
        marker.bindPopup(`<b>${a.code}</b><br>${a.name}`);
        marker.on("click", ()=> agregarPuntoRuta(a));
    });

    // ------------------------------
    // Funciones
    // ------------------------------
    function agregarPuntoRuta(a){
        ruta.push(a);
        actualizarLista();
        dibujarRuta();
    }

    function actualizarLista(){
        listaRuta.innerHTML = "";
        ruta.forEach((a,i)=> listaRuta.innerHTML += `<li>${i+1}. ${a.code} - ${a.name}</li>`);
    }

    function resetRuta(){
        ruta = [];
        if(rutaLayer) map.removeLayer(rutaLayer);
        listaRuta.innerHTML = "";
        infoDiv.innerHTML = "";
    }

    // ------------------------------
    // Haversine distance
    // ------------------------------
    function dist(a,b){
        const R=6371;
        const dLat=(b[0]-a[0])*Math.PI/180;
        const dLng=(b[1]-a[1])*Math.PI/180;
        const lat1=a[0]*Math.PI/180;
        const lat2=b[0]*Math.PI/180;
        const h=Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
        return 2*R*Math.asin(Math.sqrt(h));
    }

    // ------------------------------
    // Gran círculo / Curvas suaves
    // ------------------------------
    function generarCurva(a,b, pasos=100){
        const lat1=a[0]*Math.PI/180, lon1=a[1]*Math.PI/180;
        const lat2=b[0]*Math.PI/180, lon2=b[1]*Math.PI/180;
        const d=2*Math.asin(Math.sqrt(Math.sin((lat1-lat2)/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon1-lon2)/2)**2));
        let ruta=[];
        for(let i=0;i<pasos;i++){
            const f=i/(pasos-1);
            const A=Math.sin((1-f)*d)/Math.sin(d);
            const B=Math.sin(f*d)/Math.sin(d);
            const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
            const y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
            const z=A*Math.sin(lat1)+B*Math.sin(lat2);
            const lat=Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI;
            const lon=Math.atan2(y,x)*180/Math.PI;
            ruta.push([lat,lon]);
        }
        return ruta;
    }

    // ------------------------------
    // Dibujar ruta con curvas
    // ------------------------------
    function dibujarRuta(){
        if(rutaLayer) map.removeLayer(rutaLayer);
        if(ruta.length<2) return;

        let coords = [];
        let distanciaTotal = 0;

        for(let i=1;i<ruta.length;i++){
            const curva = generarCurva(ruta[i-1].coords, ruta[i].coords, 50);
            coords = coords.concat(curva);

            // distancia total
            distanciaTotal += dist(ruta[i-1].coords, ruta[i].coords);
        }

        rutaLayer = L.polyline(coords, {color:"red", weight:3}).addTo(map);
        map.fitBounds(rutaLayer.getBounds());

        const velocidad = 900; // km/h
        const eta = (distanciaTotal/velocidad).toFixed(2);

        infoDiv.innerHTML = `<b>Distancia Total:</b> ${distanciaTotal.toFixed(1)} km<br>
                             <b>ETA aprox:</b> ${eta} h`;

        animarAvion(coords);
    }

    // ------------------------------
    // Avión animado
    // ------------------------------
    let avionMarker=null;
    function animarAvion(coords){
        if(!coords || coords.length<2) return;
        if(avionMarker) map.removeLayer(avionMarker);

        const planeIcon = L.divIcon({className:"", html:'✈️', iconSize:[30,30]});
        let idx=0;
        avionMarker=L.marker(coords[0], {icon:planeIcon}).addTo(map);

        function mover(){
            if(idx>=coords.length-1) return;
            avionMarker.setLatLng(coords[idx]);

            // rotación
            const p1=coords[idx];
            const p2=coords[idx+1];
            const ang = Math.atan2(p2[1]-p1[1], p2[0]-p1[0])*180/Math.PI + 90;
            avionMarker.getElement().style.transform = `rotate(${ang}deg)`;

            idx++;
            setTimeout(mover,50);
        }
        mover();
    }
