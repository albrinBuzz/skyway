version: '3.8'

services:
  skyway_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyway_app_container
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Apunta a tu base de datos existente en Azure PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://skyway-server.postgres.database.azure.com:5432/skyway?sslmode=require
      - SPRING_DATASOURCE_USERNAME=aerolinea_user
      - SPRING_DATASOURCE_PASSWORD=qTc31$#C1UNT#B

      # Forzar GC y optimización de memoria
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx350m -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=48m -Xss256k -XX:+UseSerialGC
    deploy:
      resources:
        limits:
          memory: 480M  # Límite duro del contenedor en el hosting