version: '3.8'

services:
  skyway_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyway_app_container
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M