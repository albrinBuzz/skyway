version: '3.8'

services:
  # =====================================================================
  # 1. CONTENEDOR POSTGRESQL + POSTGIS (OPCIÓN DOCKER)
  # =====================================================================
  postgres_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: skyway_postgres
    restart: always
    environment:
      POSTGRES_DB: aerolinea_db
      POSTGRES_USER: ${DB_USERNAME:-aerolinea_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aerolinea_user}
      TZ: ${TZ:-America/Santiago}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dataBase/V3/dump.sql:/docker-entrypoint-initdb.d/01_dump.sql
    profiles:
      - docker-db

  # =====================================================================
  # 2. BACKEND SPRING BOOT
  # =====================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyway_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,mobile}
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET}
      LOGGING_ANSI_ENABLED: ${LOGGING_ANSI_ENABLED:-false}
      PORT: 8080
      TZ: ${TZ:-America/Santiago}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: