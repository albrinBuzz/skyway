services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,mobile}
      DB_URL: ${DB_URL:?Define DB_URL en .env}
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET:-}
      MOBILE_ALLOWED_ORIGINS: ${MOBILE_ALLOWED_ORIGINS:-http://localhost:8100,http://localhost,https://localhost,capacitor://localhost}
      MOBILE_ZONE: ${MOBILE_ZONE:-America/Santiago}
      SKYWAY_MAIL_LISTENER_ENABLED: ${SKYWAY_MAIL_LISTENER_ENABLED:-false}
      PORT: 8080
      TZ: America/Santiago
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${MOBILE_PORT:-8100}:80"