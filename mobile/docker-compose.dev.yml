# Ejecutar desde la carpeta mobile. Proyecto separado del Compose principal.
name: skyway-mobile-dev

services:
  mobile-dev:
    image: node:22-alpine
    init: true
    working_dir: /app
    ports:
      - "${SKYWAY_DEV_MOBILE_PORT:-8100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Puerto PUBLICADO por el backend en tu PC, no el nombre de su contenedor.
      SKYWAY_DEV_BACKEND_URL: "${SKYWAY_DEV_BACKEND_URL:-http://host.docker.internal:8080}"
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./:/app
      - mobile_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - >-
        npm ci && exec npx ng serve
        --configuration development
        --host 0.0.0.0
        --port 8100
        --proxy-config proxy.docker.dev.cjs
        --poll 1000

volumes:
  mobile_node_modules:
