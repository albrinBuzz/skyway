<ion-header><ion-toolbar><ion-title>Notificaciones</ion-title><ion-buttons slot="end"><ion-button aria-label="Actualizar" (click)="load()" [disabled]="busy"><ion-icon name="refresh-outline" slot="icon-only"></ion-icon></ion-button></ion-buttons></ion-toolbar></ion-header>
<ion-content><main class="page"><span class="eyebrow">AL DÍA CON TU VIAJE</span><h1>Tu bandeja de alertas.</h1><div *ngIf="busy" class="loading"><ion-spinner></ion-spinner></div><p *ngIf="error" class="error" role="alert">{{ error }}</p>
<ng-container *ngIf="data as result"><ion-card *ngFor="let n of result.contenido"><ion-card-content><div class="row"><span class="eyebrow">{{ n.fecha | date:'dd MMM yyyy · HH:mm' }}</span><span class="status" *ngIf="!n.leido">Nueva</span></div><h2>{{ n.titulo || 'Notificación' }}</h2><p style="white-space:pre-wrap">{{ n.mensaje }}</p><ion-button fill="clear" size="small" *ngIf="!n.leido" [disabled]="saving.has(n.idNotificacion)" (click)="leer(n)">Marcar como leída</ion-button><p class="muted" *ngIf="n.leido">Leída</p></ion-card-content></ion-card>
<p class="empty" *ngIf="!result.contenido.length">No tienes notificaciones por ahora.</p>
<nav class="pagination" *ngIf="result.totalPaginas > 1" aria-label="Paginación de notificaciones"><ion-button fill="clear" [disabled]="page === 0 || busy" (click)="load(page - 1)">Anterior</ion-button><span>{{ page + 1 }} / {{ result.totalPaginas }}</span><ion-button fill="clear" [disabled]="page + 1 >= result.totalPaginas || busy" (click)="load(page + 1)">Siguiente</ion-button></nav>
</ng-container></main></ion-content>
