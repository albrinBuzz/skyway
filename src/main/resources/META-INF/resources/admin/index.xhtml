<?xml version="1.0" encoding="UTF-8"?>

<ui:composition lang="es"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:fs="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/template/main.xhtml">

    <!-- Enlace a CSS de Bootstrap y Font Awesome -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>

    <style>
        .container {
            margin-top: 2rem;
        }
        /* Estilo para el sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 220px;
            background-color: #222;
            color: white;
            padding-top: 20px;
            z-index: 1000;
        }
        .sidebar ul {
            list-style-type: none;
            padding: 0;
        }
        .sidebar ul li a {
            color: white;
            padding: 10px;
            display: block;
            text-decoration: none;
            font-size: 16px;
        }
        .sidebar ul li a:hover {
            background-color: #444;
        }
        .sidebar ul li a .fa {
            margin-right: 10px;
        }
        /* Estilo para el contenido */
        .content {
            margin-left: 240px; /* Aseguramos que el contenido se desplace a la derecha */
            padding: 20px;
            background-color: #f8f9fa;
            min-height: 100vh; /* Aseguramos que el contenido ocupe toda la altura */
            overflow-y: auto; /* Permitimos el desplazamiento si el contenido es largo */
        }
        .card {
            margin-bottom: 20px;
        }
        .modal-header .close {
            font-size: 1.5rem;
        }
        /* Estilo de las tablas */
        .table th, .table td {
            text-align: center;
        }
        .table th {
            background-color: #f8f9fa;
        }
        
        /* Personalización de los márgenes */
.mb-3 {
    margin-bottom: 15px; /* Aumenta la separación entre elementos */
}

.mt-4 {
    margin-top: 30px; /* Mayor espacio entre la fila de precios y el resto del contenido */
}

/* Estilo para el texto de la cantidad de asientos */
.text-muted {
    color: #6c757d; /* Color gris suave */
    font-size: 0.9em; /* Reduce ligeramente el tamaño de la fuente */
}
        
    </style>

    <h:head>
        <title>Gestión de Vuelos</title>
    </h:head>

    <ui:define name="contenido">

        <div class="card">
            <h:form>
                <p:growl id="messages"/>

                <!-- Menú de navegación -->
                <p:menubar hideDelay="1000">
                    <f:facet name="start">
                        <p:graphicImage name="images/primefaces-logo.svg" library="showcase" />
                    </f:facet>

                    <!-- Menú Vuelos -->
                    <p:submenu label="Vuelos" icon="pi pi-fw pi-plane">
                        <p:submenu label="Gestionar" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Vuelos" icon="pi pi-fw pi-list" />
                            <p:menuitem value="Nuevo Vuelo" icon="pi pi-fw pi-plus" />
                            <p:menuitem value="Modificar Vuelo" icon="pi pi-fw pi-pencil" />
                        </p:submenu>
                        <p:menuitem value="Estados de Vuelos" icon="pi pi-fw pi-check-circle" />
                        <p:menuitem value="Precios de Asientos" icon="pi pi-fw pi-dollar" />
                    </p:submenu>

                    <!-- Menú Reservas -->
                    <p:submenu label="Reservas" icon="pi pi-fw pi-bookmark">
                        <p:submenu label="Gestionar" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Reservas" icon="pi pi-fw pi-list" />
                            <p:menuitem value="Nueva Reserva" icon="pi pi-fw pi-plus" />
                            <p:menuitem value="Modificar Reserva" icon="pi pi-fw pi-pencil" />
                            <p:menuitem value="Ver Equipaje" icon="pi pi-fw pi-suitcase" />
                        </p:submenu>
                        <p:menuitem value="Estado de Reservas" icon="pi pi-fw pi-check-circle" />
                    </p:submenu>

                    <!-- Menú Pagos -->
                    <p:submenu label="Pagos" icon="pi pi-fw pi-credit-card">
                        <p:submenu label="Gestionar Pagos" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Pagos" icon="pi pi-fw pi-list" />
                            <p:menuitem value="Registrar Pago" icon="pi pi-fw pi-plus" />
                        </p:submenu>
                        <p:menuitem value="Métodos de Pago" icon="pi pi-fw pi-credit-card" />
                    </p:submenu>

                    <!-- Menú Usuarios -->
                    <p:submenu label="Usuarios" icon="pi pi-fw pi-user">
                        <p:submenu label="Gestionar" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Usuarios" icon="pi pi-fw pi-users" />
                            <p:menuitem value="Nuevo Usuario" icon="pi pi-fw pi-user-plus" />
                            <p:menuitem value="Modificar Usuario" icon="pi pi-fw pi-pencil" />
                        </p:submenu>
                    </p:submenu>

                    <!-- Menú Pilotos -->
                    <p:submenu label="Pilotos" icon="pi pi-fw pi-user">
                        <p:submenu label="Gestionar Pilotos" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Pilotos" icon="pi pi-fw pi-users" />
                            <p:menuitem value="Nuevo Piloto" icon="pi pi-fw pi-user-plus" />
                        </p:submenu>
                    </p:submenu>

                    <!-- Menú Aviones -->
                    <p:submenu label="Aviones" icon="pi pi-fw pi-rocket">
                        <p:submenu label="Gestionar Aviones" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Aviones" icon="pi pi-fw pi-th-large" />
                            <p:menuitem value="Nuevo Avión" icon="pi pi-fw pi-plus" />
                            <p:menuitem value="Modificar Avión" icon="pi pi-fw pi-pencil" />
                        </p:submenu>
                    </p:submenu>

                    <!-- Menú Aeropuertos -->
                    <p:submenu label="Aeropuertos" icon="pi pi-fw pi-sitemap">
                        <p:submenu label="Gestionar Aeropuertos" icon="pi pi-fw pi-cogs">
                            <p:menuitem value="Ver Aeropuertos" icon="pi pi-fw pi-map" />
                            <p:menuitem value="Nuevo Aeropuerto" icon="pi pi-fw pi-plus" />
                            <p:menuitem value="Modificar Aeropuerto" icon="pi pi-fw pi-pencil" />
                        </p:submenu>
                    </p:submenu>

                    <!-- Menú Reportes -->
                    <p:submenu label="Reportes" icon="pi pi-fw pi-chart-line">
                        <p:menuitem value="Reporte de Vuelos" icon="pi pi-fw pi-file" />
                        <p:menuitem value="Reporte de Reservas" icon="pi pi-fw pi-file" />
                        <p:menuitem value="Reporte de Pagos" icon="pi pi-fw pi-file" />
                        <p:menuitem value="Reporte de Pilotos" icon="pi pi-fw pi-file" />
                    </p:submenu>
                    
                    
                    <!-- Menú Blogs -->
					<p:submenu label="Blogs" icon="pi pi-fw pi-pencil">
					    <p:submenu label="Gestionar" icon="pi pi-fw pi-cogs">
    						<p:menuitem value="Ver Blogs" icon="pi pi-fw pi-list" url="/blog/index.xhtml" />
					     		
					     	<p:menuitem value="Ver Blogs" icon="pi pi-fw pi-plus" url="/blog/agregarPost.xhtml" />	
					        <p:menuitem value="Modificar Blog" icon="pi pi-fw pi-pencil" action="#{bean.modificarBlog}" />
					    </p:submenu>
					</p:submenu>
					                    

                    <p:divider layout="vertical"/>

                    <!-- Menú de Cierre -->
                    <p:menuitem value="Salir" icon="pi pi-fw pi-power-off" />

                    <f:facet name="end">
                        <div class="ui-input-icon-left mr-2">
                            <i class="pi pi-fw pi-search" />
                            <p:inputText placeholder="Buscar..."/>
                        </div>
                        <p:button value="Cerrar Sesión" icon="pi pi-fw pi-sign-out" styleClass="ui-button-info"/>
                    </f:facet>
                </p:menubar>
            </h:form>
        </div>


        <!-- Contenido Principal -->
        <div class="content">

            <div class="card crud-demo">
                <h:form id="form">
                    <p:growl id="messages" showDetail="true" />

                    <p:toolbar>
                        <p:toolbarGroup>
                            <!-- Botón Nuevo -->
                            <p:commandButton value="Nuevo Vuelo" icon="pi pi-plus" actionListener="#{vueloView.openNew}"
                                             update=":dialogs:manage-vuelo-content" oncomplete="PF('manageVueloDialog').show()"
                                             styleClass="ui-button-success" style="margin-right: .5rem">
                                <p:resetInput target=":dialogs:manage-vuelo-content" />
                            </p:commandButton>
                            <!-- Botón Eliminar -->
                            <p:commandButton id="delete-vuelos-button" value="Eliminar"
                                             icon="pi pi-trash" actionListener="#{vueloView.deleteSelectedVuelos}"
                                             styleClass="ui-button-danger" disabled="#{!vueloView.hasSelectedVuelos()}" update="@this">
                                <p:confirm header="Confirmación" message="¿Eliminar los vuelos seleccionados?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </p:toolbarGroup>

                    </p:toolbar>

                    <!-- Tabla de vuelos -->
                    <p:dataTable id="dt-vuelos" widgetVar="dtVuelos" var="vuelo" value="#{vueloView.vuelos}"
                                 reflow="true" styleClass="vuelos-table" selection="#{vueloView.selectedVuelos}"
                                 rowKey="#{vuelo.idVuelo}" paginator="true" rows="10" selectionRowMode="add" paginatorPosition="bottom"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="5,10,{ShowAll|'All'}">
                        <f:facet name="header">
                            <div class="vuelos-table-header">
                                <span style="font-weight: bold">VUELOS</span>
                                <span class="filter-container ui-input-icon-left">
                        <i class="pi pi-search"></i>
                        <p:inputText id="globalFilter" onkeyup="PF('dtVuelos').filter()" placeholder="Buscar" />
                    </span>
                            </div>
                        </f:facet>

                        <p:ajax event="rowSelect" update=":form:delete-vuelos-button" />
                        <p:ajax event="rowUnselect" update=":form:delete-vuelos-button" />
                        <p:ajax event="rowSelectCheckbox" update=":form:delete-vuelos-button" />
                        <p:ajax event="rowUnselectCheckbox" update=":form:delete-vuelos-button" />
                        <p:ajax event="toggleSelect" update=":form:delete-vuelos-button" />

                        <!-- Columnas de la tabla -->
                        <p:column selectionMode="multiple" exportable="false"></p:column>

                        <p:column headerText="Número de Vuelo" sortBy="#{vuelo.numeroVuelo}" filterBy="#{vuelo.numeroVuelo}">
                            <h:outputText value="#{vuelo.numeroVuelo}" />
                        </p:column>

                        <p:column headerText="Fecha y Hora de Salida" sortBy="#{vuelo.fechaHoraSalida}" filterBy="#{vuelo.fechaHoraSalida}">
                            <h:outputText value="#{vuelo.fechaHoraSalida}" />
                        </p:column>

                        <p:column headerText="Fecha y Hora de Llegada" sortBy="#{vuelo.fechaHoraLlegada}" filterBy="#{vuelo.fechaHoraLlegada}">
                            <h:outputText value="#{vuelo.fechaHoraLlegada}" />
                        </p:column>

                        <p:column headerText="Precio" sortBy="#{vuelo.precio}">
                            <h:outputText value="#{vuelo.precio}" style="font-weight: 700">
                                <f:convertNumber currencySymbol="$" type="currency" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Aeropuerto de Salida" sortBy="#{vuelo.aeropuerto2.nombre}" filterBy="#{vuelo.aeropuerto2.codigoIata}">
                            <h:outputText value="#{vuelo.aeropuerto2.codigoIata}" />
                        </p:column>

                        <p:column headerText="Aeropuerto de Llegada" sortBy="#{vuelo.aeropuerto1.nombre}" filterBy="#{vuelo.aeropuerto1.codigoIata}">
                            <h:outputText value="#{vuelo.aeropuerto1.codigoIata}" />
                        </p:column>

                        <p:column headerText="Estado del Vuelo" sortBy="#{vuelo.estadoVuelo.nombre}" filterBy="#{vuelo.estadoVuelo.estado}">
                            <h:outputText value="#{vuelo.estadoVuelo.estado}" />
                        </p:column>

                        <!-- Acciones -->
                        <p:column exportable="false" ariaHeaderText="Acciones">
                            <p:commandButton icon="pi pi-pencil" update=":dialogs:manage-vuelo-content"
                                             oncomplete="PF('manageVueloDialog').show()"
                                             styleClass="edit-button rounded-button ui-button-success"
                                             actionListener="#{vueloView.editarVuelo(vuelo)}"
                                             process="@this">
                                <f:setPropertyActionListener value="#{vuelo}" target="#{vueloView.selectedVuelo}" />
                                <p:resetInput target=":dialogs:manage-vuelo-content" />
                            </p:commandButton>
                            <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash" process="@this"
                                             oncomplete="PF('deleteVueloDialog').show()">

                                <f:setPropertyActionListener value="#{vuelo}" target="#{vueloView.selectedVuelo}" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                </h:form>

                <h:form id="dialogs">
                    <p:dialog header="Detalles del Vuelo" showEffect="fade" modal="true" widgetVar="manageVueloDialog"
                              responsive="true">
                        <p:outputPanel id="manage-vuelo-content" class="ui-fluid">
                            <h:messages id="errorMessages" style="color:red;margin:8px;" />
                            <p:outputPanel rendered="#{not empty vueloView.selectedVuelo}">
                                <div class="field">
                                    <p:outputLabel for="numeroVuelo">Número de Vuelo</p:outputLabel>
                                    <p:inputText id="numeroVuelo" value="#{vueloView.selectedVuelo.numeroVuelo}" required="true" />
                                </div>
                                <div class="field">
                                    <p:outputLabel for="fechaHoraSalida">Fecha y Hora de Salida</p:outputLabel>
                                    <p:datePicker  id="fechaHoraSalida" value="#{vueloView.selectedVuelo.fechaHoraSalida}" showTime="true" pattern="dd-MM-yyyy HH:mm" />
                                </div>
                                <div class="field">
                                    <p:outputLabel for="fechaHoraLlegada">Fecha y Hora de Llegada</p:outputLabel>
                                    <p:datePicker id="fechaHoraLlegada" value="#{vueloView.selectedVuelo.fechaHoraLlegada}" showTime="true" pattern="dd-MM-yyyy HH:mm" />
                                </div>
                                <div class="field">
                                    <p:outputLabel for="precio">Precio</p:outputLabel>
                                    <p:inputNumber id="precio" value="#{vueloView.selectedVuelo.precio}" symbol="$" />
                                </div>

                                <div class="field">
                                    <p:outputLabel for="aeropuertoSalida">Aeropuerto de Salida</p:outputLabel>

                                    <h:selectOneMenu id="aeropuertoSalida" value="#{vueloView.aeropuerto1}" required="true" styleClass="form-control">
                                    	
                                        <f:selectItems value="#{vueloView.listaAeropuertos}" var="aero" itemLabel="#{aero.nombreAeropuerto}" itemValue="#{aero.nombreAeropuerto}" />
                                    </h:selectOneMenu>

                                </div>

                                <div class="field">
                                    <p:outputLabel for="aeropuertoLlegada">Aeropuerto de Llegada</p:outputLabel>

                                    <h:selectOneMenu id="aeropuertoLlegada" value="#{vueloView.aeropuerto2}" required="true" styleClass="form-control">
                                        <f:selectItems value="#{vueloView.listaAeropuertos}" var="aero" itemLabel="#{aero.nombreAeropuerto}" itemValue="#{aero.nombreAeropuerto}" />
                                    </h:selectOneMenu>


                                </div>
                                
                             
                                
                                <div class="field">
                                    <p:outputLabel for="piloto">Piloto</p:outputLabel>
										
                                    <h:selectOneMenu id="piloto" value="#{vueloView.piloto}" required="true" styleClass="form-control" >
                                        <f:selectItems value="#{vueloView.listaPilotos}" var="pl" itemLabel="#{pl.nombre.concat(' ').concat(pl.apellido).concat(' ').concat(pl.rutUsuario)}" itemValue="#{pl.rutUsuario}" />
                                    </h:selectOneMenu>
                                </div>
                                
                                <div class="field">
                                    <p:outputLabel for="estadoVuelo">Estado del Vuelo</p:outputLabel>
                                    <p:selectOneMenu id="estadoVuelo" value="#{vueloView.estadoVuelo}" styleClass="form-control">
                                        <f:selectItems value="#{vueloView.listaEstadosVuelo}" var="estado" itemLabel="#{estado.estado}" itemValue="#{estado.estado}" />
                                    </p:selectOneMenu>
                                </div>
                                
                                
                                <div class="row">
								    <div class="col-md-6">
								        <div class="form-group">
								            <p:outputLabel for="avion">Avión</p:outputLabel>
								            <h:selectOneMenu id="avion" value="#{vueloView.avion}" required="true" styleClass="form-control">
								                <f:selectItems value="#{vueloView.listaAviones}" var="avion" itemLabel="#{avion.modelo}" itemValue="#{avion.idAvion}" />
								                <!-- Se activará el listener ajaxListener cuando se cambie el avión -->
								                <f:ajax listener="#{vueloView.ajaxListener}" render="cantidadAsientos asientosPrimeraClase asientosEjecutiva asientosEconomica precioPrimera precioEjecutiva precioEconomica" />
								            </h:selectOneMenu>
								        </div>
								    </div>
								
								    <div class="col-md-6">
								        <div class="form-group">
								            <p:outputLabel for="cantidadAsientos" value="Cantidad de asientos "> </p:outputLabel>
								            <h:outputText id="cantidadAsientos" value="#{vueloView.cantidadAsientos}" />
								        </div>
								    </div>
								</div>
								
							<div class="row">
    <!-- Asientos y precios por clase -->
    <div class="col-sm-4">
        <!-- Cantidad de asientos en Primera Clase -->
        <h:outputText value="Asientos Primera Clase: #{vueloView.asientosPrimeraClase}" 
                      styleClass="text-muted mb-3" />

        <!-- Precio Primera Clase -->
        <h:outputLabel value="Precio Primera" for="precioPrimera" />
        <p:inputNumber id="precioPrimera" 
                       value="#{vueloView.precioPrimera}" 
                       minValue="1" 
                       decimalPlaces="0" 
                       symbol="$" 
                       currency="true" 
                       required="true" 
                       requiredMessage="El precio es obligatorio" 
                       styleClass="mb-3" />
    </div>

    <div class="col-sm-4">
        <!-- Cantidad de asientos en Clase Ejecutiva -->
        <h:outputText value="Asientos Ejecutiva: #{vueloView.asientosEjecutiva}" 
                      styleClass="text-muted mb-3" />

        <!-- Precio Ejecutiva -->
        <h:outputLabel value="Precio Ejecutiva" for="precioEjecutiva" />
        <p:inputNumber id="precioEjecutiva" 
                       value="#{vueloView.precioEjecutiva}" 
                       minValue="1" 
                       decimalPlaces="0" 
                       symbol="$" 
                       required="true" 
                       requiredMessage="El precio es obligatorio" 
                       styleClass="mb-3" />
    </div>

    <div class="col-sm-4">
        <!-- Cantidad de asientos en Clase Económica -->
        <h:outputText value="Asientos Económica: #{vueloView.asientosEconomica}" 
                      styleClass="text-muted mb-3" />

        <!-- Precio Económica -->
        <h:outputLabel value="Precio Económica" for="precioEconomica" />
        <p:inputNumber id="precioEconomica" 
                       value="#{vueloView.precioEconomica}" 
                       minValue="1" 
                        decimalPlaces="0" 
                       symbol="$" 
                       required="true" 
                       requiredMessage="El precio es obligatorio" 
                       styleClass="mb-3" />
    </div>
</div>

<!-- Añadir un margen adicional para separar la fila de los precios de otros elementos -->
<div class="mt-4"></div>
							
								                                
								                                
                                
            				
                                
                            </p:outputPanel>
                        </p:outputPanel>

                        <f:facet name="footer">
                            <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{vueloView.saveVuelo}"
                                             update="manage-vuelo-content" process="manage-vuelo-content @this" />
                            <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageVueloDialog').hide()"
                                             class="ui-button-secondary" type="button" />
                        </f:facet>
                    </p:dialog>

                    <!-- Confirmación de eliminación -->
                    <p:confirmDialog widgetVar="deleteVueloDialog" showEffect="fade" width="300"
                                     message="¿Eliminar el vuelo?" header="Confirmar" severity="warn">
                        <p:commandButton value="Sí" icon="pi pi-check" actionListener="#{vueloView.deleteVuelo}"
                                         process="@this" update=":form:delete-vuelos-button"
                                         oncomplete="PF('deleteVueloDialog').hide()" />
                        <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                         onclick="PF('deleteVueloDialog').hide()" />
                    </p:confirmDialog>

                </h:form>
            </div>


        </div>

        <!-- Scripts adicionales -->
        <script>
            $(document).ready(function() {
                window.eliminarVuelo = function(id) {
                    if(confirm("¿Está seguro de que desea eliminar este vuelo?")) {
                        alert("Vuelo eliminado: " + id);
                    }
                };
            });
        </script>

    </ui:define>

</ui:composition>
