<ui:composition lang="es"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/admin/template.xhtml">

    <ui:define name="contenido-admin">

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <style>
            .tel-root {
                background-color: #090d16;
                min-height: 100vh;
                color: #e2e8f0;
            }
            .card-custom {
                background: #10192b;
                border: 1px solid #1e2d45;
                border-radius: 12px;
                padding: 15px 18px;
                color: #e2e8f0;
            }
            .kpi-title {
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #94a3b8;
                font-weight: 700;
            }
            .text-value {
                font-size: 1.4rem;
                font-weight: 700;
                line-height: 1.25;
            }
            @media (min-width: 768px) {
                .text-value { font-size: 1.6rem; }
            }
            .detail-item {
                padding: 6px 0;
                border-bottom: 1px solid #19253a;
                display: flex;
                justify-content: space-between;
                gap: 10px;
                font-size: 0.81rem;
                align-items: center;
            }
            .detail-item:last-child { border-bottom: none; }
            .detail-item span:first-child { color: #94a3b8; }
            .detail-item strong { text-align: right; word-break: break-word; }
            .progress-custom {
                height: 8px;
                background-color: #0b1220;
                border: 1px solid #1e2d45;
                border-radius: 999px;
                overflow: hidden;
            }
            .chart-container {
                position: relative;
                height: 220px;
                width: 100%;
            }
            .tel-toolbar {
                background: #10192b;
                border: 1px solid #1e2d45;
                border-radius: 12px;
                padding: 14px 18px;
            }
            .tel-select {
                background: #0b1220;
                color: #f8fafc;
                border: 1px solid #243b61;
                border-radius: 8px;
                padding: 7px 10px;
                font-size: 0.82rem;
                font-weight: 600;
            }
            .tel-btn-primary {
                background: #1d4ed8;
                border: 1px solid #2563eb;
                color: #ffffff;
                border-radius: 8px;
                padding: 7px 14px;
                font-size: 0.83rem;
                font-weight: 700;
                cursor: pointer;
            }
            .tel-btn-primary:hover { background: #1e40af; }
            .tel-btn-danger {
                background: #991b1b;
                border: 1px solid #dc2626;
                color: #ffffff;
                border-radius: 8px;
                padding: 7px 14px;
                font-size: 0.83rem;
                font-weight: 700;
                cursor: pointer;
            }
            .tel-btn-danger:hover { background: #7f1d1d; }
            .tel-btn-secondary {
                background: #0b1220;
                border: 1px solid #243b61;
                color: #cbd5e1;
                border-radius: 8px;
                padding: 7px 12px;
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
            }
            .tel-btn-secondary:hover {
                border-color: #60a5fa;
                color: #93c5fd;
            }
            .tel-tabs-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                background: #10192b;
                border: 1px solid #1e2d45;
                border-radius: 12px;
                padding: 10px 14px;
            }
            .tel-nav-tab {
                background: #0b1220;
                border: 1px solid #1e2d45;
                color: #94a3b8;
                border-radius: 8px;
                padding: 7px 13px;
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .tel-nav-tab:hover {
                border-color: #3b82f6;
                color: #e2e8f0;
            }
            .tel-nav-tab.active {
                background: #1d4ed8;
                border-color: #2563eb;
                color: #ffffff;
            }
            .tel-alert {
                display: flex;
                align-items: center;
                gap: 9px;
                border-radius: 10px;
                padding: 10px 14px;
                font-size: 0.84rem;
                font-weight: 600;
                margin-bottom: 8px;
            }
            .tel-alert-ok {
                background: rgba(22, 101, 52, 0.18);
                border: 1px solid rgba(34, 197, 94, 0.35);
                color: #bbf7d0;
            }
            .tel-alert-warning {
                background: rgba(146, 64, 14, 0.22);
                border: 1px solid rgba(245, 158, 11, 0.4);
                color: #fde68a;
            }
            .tel-alert-danger {
                background: rgba(153, 27, 27, 0.25);
                border: 1px solid rgba(248, 113, 113, 0.45);
                color: #fecaca;
            }
            .table-dark {
                --bs-table-bg: transparent;
                --bs-table-border-color: #19253a;
            }
        </style>

        <div class="container-fluid px-2 px-md-3 py-3 tel-root">

            <!-- BARRA SUPERIOR, ALERTAS Y KPIS -->
            <ui:include src="/admin/telemetry/_toolbar-kpis.xhtml"/>

            <!-- NAVEGACIÓN MODULAR POR SECCIÓN -->
            <div class="tel-tabs-bar mb-3">
                <button type="button" class="tel-nav-tab active" data-tab="overview">
                    <i class="pi pi-chart-line"/> Gráficos en Vivo
                </button>
                <button type="button" class="tel-nav-tab" data-tab="infra">
                    <i class="pi pi-server"/> Infraestructura &amp; JVM
                </button>
                <button type="button" class="tel-nav-tab" data-tab="database">
                    <i class="pi pi-database"/> PostgreSQL &amp; HikariCP
                </button>
                <button type="button" class="tel-nav-tab" data-tab="traffic">
                    <i class="pi pi-globe"/> Tráfico HTTP &amp; JSF 4
                </button>
                <button type="button" class="tel-nav-tab" data-tab="ops">
                    <i class="pi pi-send"/> Operación SkyWay &amp; Auditoría
                </button>
                <button type="button" class="tel-nav-tab ms-md-auto" data-tab="all">
                    <i class="pi pi-th-large"/> Ver Todo
                </button>
            </div>

            <!-- SUBVISTAS MODULARES -->
            <div class="tel-tab-section mb-3" data-section="overview">
                <ui:include src="/admin/telemetry/_tab-charts-overview.xhtml"/>
            </div>

            <div class="tel-tab-section mb-3" data-section="infra">
                <ui:include src="/admin/telemetry/_tab-infra-jvm.xhtml"/>
            </div>

            <div class="tel-tab-section mb-3" data-section="database">
                <ui:include src="/admin/telemetry/_tab-database-pg.xhtml"/>
            </div>

            <div class="tel-tab-section mb-3" data-section="traffic">
                <ui:include src="/admin/telemetry/_tab-traffic-jsf.xhtml"/>
            </div>

            <div class="tel-tab-section mb-3" data-section="ops">
                <ui:include src="/admin/telemetry/_tab-skyway-ops.xhtml"/>
            </div>

        </div>

        <script type="text/javascript">
            window.SKYWAY_TELEMETRY_BASE = "#{request.contextPath}";
        </script>
        <script type="text/javascript" src="#{request.contextPath}/resources/js/metrics-dashboard.js"></script>

    </ui:define>
</ui:composition>
