<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets">

    <div class="row g-2 g-md-3">
        <div class="col-12 col-lg-6">
            <div class="card-custom h-100">
                <h6 class="mb-3 text-light fw-bold">Rendimiento Sistema: RAM JVM (MB) vs Latencia SQL (ms) vs CPU (%)</h6>
                <div class="chart-container">
                    <canvas id="liveChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card-custom h-100">
                <h6 class="mb-3 text-light fw-bold">Heap JVM (MB) vs Tráfico HTTP (Req/min) &amp; Latencia HTTP (ms)</h6>
                <div class="chart-container">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card-custom h-100">
                <h6 class="mb-3 text-info fw-bold">Distribución de Hilos JVM por Estado</h6>
                <div class="chart-container" style="height: 205px;">
                    <canvas id="threadsChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card-custom h-100">
                <h6 class="mb-3 text-success fw-bold">Distribución de Respuestas HTTP (2xx / 3xx / 4xx / 5xx)</h6>
                <div class="chart-container" style="height: 205px;">
                    <canvas id="httpCodesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</ui:composition>
