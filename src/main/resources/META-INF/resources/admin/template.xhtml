<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/template/main.xhtml">

    <ui:define name="head">
        <style type="text/css">
            /* --- VARIABLES CORPORATIVAS SKYWAY OPERACIONES --- */
            :root {
                --primary-deep: #070c14;
                --topbar-bg: rgba(11, 20, 38, 0.88);
                --sidebar-bg: #0b1324;
                --sidebar-border: #1e293b;
                --accent-blue: #38bdf8;
                --accent-hover: rgba(56, 189, 248, 0.08);
                --text-main: #f8fafc;
                --text-muted: #64748b;
                --border-glow: rgba(255, 255, 255, 0.05);
            }

            .admin-wrapper {
                display: flex;
                min-height: 100vh;
                background-color: var(--primary-deep);
                font-family: var(--font-family, 'Segoe UI', Roboto, sans-serif);
                overflow-x: hidden;
            }

            /* --- SIDEBAR BASE --- */
            .sidebar {
                width: 250px;
                background-color: var(--sidebar-bg);
                border-right: 1px solid var(--sidebar-border);
                display: flex;
                flex-direction: column;
                transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 110;
                overflow: hidden;
                flex-shrink: 0;
            }

            /* --- HEADER DEL SIDEBAR --- */
            .sidebar-header {
                height: 65px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                background: rgba(0, 0, 0, 0.2);
                border-bottom: 1px solid var(--sidebar-border);
                white-space: nowrap;
                overflow: hidden;
            }

            .brand-wrapper {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                width: 100%;
            }

            .brand-icon {
                font-size: 1.2rem;
                color: var(--accent-blue);
                background: rgba(56, 189, 248, 0.1);
                padding: 8px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .brand-details {
                display: flex;
                flex-direction: column;
                line-height: 1.1;
                transition: opacity 0.2s ease;
            }

            .brand-title {
                color: var(--text-main);
                font-weight: 700;
                font-size: 0.92rem;
                letter-spacing: 0.3px;
            }

            .brand-subtitle {
                color: var(--accent-blue);
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.8px;
                text-transform: uppercase;
                margin-top: 2px;
            }

            /* --- LISTA Y ELEMENTOS DEL MENÚ --- */
            .menu-list {
                list-style: none;
                padding: 12px 8px;
                margin: 0;
                flex-grow: 1;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .menu-category-title {
                padding: 14px 12px 6px 12px;
                font-size: 0.65rem;
                font-weight: 700;
                color: var(--text-muted);
                letter-spacing: 1px;
                text-transform: uppercase;
                white-space: nowrap;
                transition: opacity 0.2s ease;
            }

            .menu-item {
                margin-bottom: 4px;
                position: relative;
            }

            .menu-link {
                display: flex;
                align-items: center;
                padding: 10px 12px;
                color: #94a3b8 !important;
                text-decoration: none;
                border-radius: 8px;
                transition: background 0.2s ease, color 0.2s ease;
                white-space: nowrap;
                font-size: 0.88rem;
            }

            .menu-link i {
                font-size: 1.15rem;
                width: 24px;
                min-width: 24px;
                text-align: center;
                transition: color 0.2s ease;
                margin-right: 12px;
            }

            .menu-link label {
                cursor: pointer;
                white-space: nowrap;
                margin: 0;
                transition: opacity 0.2s ease;
            }

            .menu-link:hover {
                background: var(--accent-hover);
                color: var(--text-main) !important;
            }

            .menu-link:hover i {
                color: var(--accent-blue);
            }

            .menu-item.active .menu-link {
                background: rgba(56, 189, 248, 0.1) !important;
                color: var(--text-main) !important;
                font-weight: 600;
            }

            .menu-item.active .menu-link i {
                color: var(--accent-blue);
            }

            .menu-item.active::before {
                content: '';
                position: absolute;
                left: -8px;
                top: 20%;
                height: 60%;
                width: 3px;
                background: var(--accent-blue);
                border-radius: 0 4px 4px 0;
                box-shadow: 0 0 8px var(--accent-blue);
            }

            /* --- ESTADOS CUANDO EL SIDEBAR ESTÁ COLAPSADO --- */
            .sidebar.collapsed {
                width: 64px;
            }

            .sidebar.collapsed .brand-details,
            .sidebar.collapsed .menu-category-title,
            .sidebar.collapsed .menu-link label {
                opacity: 0;
                display: none !important;
            }

            .sidebar.collapsed .sidebar-header {
                padding: 0;
                justify-content: center;
            }

            .sidebar.collapsed .brand-wrapper {
                justify-content: center;
            }

            .sidebar.collapsed .menu-link {
                padding: 10px 0;
                justify-content: center;
            }

            .sidebar.collapsed .menu-link i {
                margin-right: 0;
            }

            .main-content {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .top-bar {
                height: 65px;
                background: var(--topbar-bg);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 1.5rem;
                border-bottom: 1px solid var(--sidebar-border);
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .toggle-btn {
                background: transparent;
                border: none;
                cursor: pointer;
                padding: 8px;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.2s;
            }

            .toggle-btn:hover {
                background: rgba(255, 255, 255, 0.05);
            }

            .toggle-btn i {
                font-size: 1.25rem;
                color: #94a3b8;
                transition: color 0.2s;
            }

            .toggle-btn:hover i {
                color: var(--text-main);
            }

            .user-profile {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 5px 12px;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            .user-profile span {
                color: #94a3b8 !important;
                font-weight: 500;
                font-size: 0.88rem;
            }

            .view-container {
                flex-grow: 1;
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                animation: fadeIn 0.4s ease-out;
            }

            @media (min-width: 768px) {
                .view-container {
                    padding: 1.5rem 2rem 2rem 2rem;
                }
            }

            .card-custom {
                width: 100%;
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                background: transparent;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(4px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
        <ui:insert name="head-admin"/>
    </ui:define>

    <ui:define name="contenido">
        <div class="admin-wrapper">
            <aside id="sidebar" class="sidebar">
                <!-- HEADER FORMAL CORPORATIVO (CCO) -->
                <div class="sidebar-header">
                    <h:link outcome="/admin/index.xhtml" styleClass="brand-wrapper">
                        <div class="brand-icon">
                            <i class="pi pi-send"></i>
                        </div>
                        <div class="brand-details">
                            <span class="brand-title">Centro de Operaciones</span>
                            <span class="brand-subtitle">SkyWay Chile</span>
                        </div>
                    </h:link>
                </div>

                <!-- MENÚ CATEGORIZADO -->
                <ul class="menu-list">

                    <li class="menu-category-title">Operaciones</li>

                    <!-- Gestión de Vuelos -->
                    <li class="menu-item #{view.viewId.endsWith('index.xhtml') ? 'active' : ''}">
                        <h:link outcome="/admin/index.xhtml" styleClass="menu-link" title="Gestión de Vuelos">
                            <i class="pi pi-map"></i>
                            <label>Gestión de Vuelos</label>
                        </h:link>
                    </li>

                    <!-- Itinerarios -->
                    <li class="menu-item #{view.viewId.contains('itinerarios') ? 'active' : ''}">
                        <h:link outcome="/admin/itinerario/itinerarios.xhtml" styleClass="menu-link" title="Itinerarios">
                            <i class="pi pi-calendar-plus"></i>
                            <label>Itinerarios</label>
                        </h:link>
                    </li>

                    <!-- Aeropuertos -->
                    <li class="menu-item #{view.viewId.contains('gestionAeropuertos') ? 'active' : ''}">
                        <h:link outcome="/admin/gestionAeropuertos.xhtml" styleClass="menu-link" title="Aeropuertos">
                            <i class="pi pi-globe"></i>
                            <label>Aeropuertos</label>
                        </h:link>
                    </li>

                    <!-- Flota de Aviones -->
                    <li class="menu-item #{view.viewId.contains('gestionFlota') ? 'active' : ''}">
                        <h:link outcome="/admin/gestionFlota.xhtml" styleClass="menu-link" title="Aviones &amp; Flota">
                            <i class="pi pi-compass"></i>
                            <label>Aviones &amp; Flota</label>
                        </h:link>
                    </li>

                    <li class="menu-category-title">Configuración</li>

                    <!-- Tarifas -->
                    <li class="menu-item #{view.viewId.contains('gestionarTarifas') ? 'active' : ''}">
                        <h:link outcome="/admin/gestionarTarifas.xhtml" styleClass="menu-link" title="Tarifas">
                            <i class="pi pi-dollar"></i>
                            <label>Tarifas</label>
                        </h:link>
                    </li>

                    <!-- Catálogos Paramétricos -->
                    <li class="menu-item #{view.viewId.contains('gestionParametricas') ? 'active' : ''}">
                        <h:link outcome="/admin/gestionParametricas.xhtml" styleClass="menu-link" title="Catálogos de Operación">
                            <i class="pi pi-sliders-h"></i>
                            <label>Catálogos de Operación</label>
                        </h:link>
                    </li>

                    <li class="menu-category-title">Sistema</li>
                    <!-- Usuarios -->
                    <li class="menu-item #{view.viewId.contains('usuarios') ? 'active' : ''}">
                        <h:link outcome="/admin/usuarios.xhtml" styleClass="menu-link" title="Usuarios &amp; Personal">
                            <i class="pi pi-users"></i>
                            <label>Usuarios &amp; Personal</label>
                        </h:link>
                    </li>
                </ul>
            </aside>

            <div class="main-content">
                <header class="top-bar">
                    <button type="button" onclick="toggleSidebar()" class="toggle-btn" title="Alternar Menú">
                        <i class="pi pi-bars"></i>
                    </button>

                    <div class="user-profile">
                        <span>Admin Aerolínea</span>
                        <p:avatar icon="pi pi-user" shape="circle" style="background-color:#1e293b; color:#fff;" />
                    </div>
                </header>

                <main class="view-container">
                    <div class="card-custom">
                        <ui:insert name="contenido-admin"/>
                    </div>
                </main>
            </div>
        </div>

        <script type="text/javascript">
            //<![CDATA[
            function toggleSidebar() {
                var sidebar = document.getElementById("sidebar");
                if (sidebar) {
                    sidebar.classList.toggle("collapsed");
                }
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
