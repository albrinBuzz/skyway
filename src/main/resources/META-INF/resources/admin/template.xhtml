<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/template/main.xhtml">

    <ui:define name="contenido">
        <style type="text/css">
            :root {
                --primary-color: #0b1426;
                --accent-color: #4c7cf3; /* Mantengo tu azul de acento original */
                --sidebar-bg: #1e293b;   /* Mantengo tu color de sidebar original */
                --text-light: #f8fafc;
                --body-bg: #080e1a;      /* Fondo oscuro para el contenido */
                --border-dark: #334155;  /* Color para bordes oscuros */
            }

            .admin-wrapper {
                display: flex;
                min-height: 100vh;
                background-color: var(--body-bg);
            }

            /* Sidebar - Mantenemos tus estilos de items */
            .sidebar {
                width: 260px;
                background-color: var(--sidebar-bg);
                color: white;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                flex-direction: column;
                border-right: 1px solid var(--border-dark); /* Borde oscuro */
                z-index: 100;
            }

            .sidebar-header {
                padding: 20px;
                text-align: center;
                background: rgba(0,0,0,0.2);
                border-bottom: 1px solid var(--border-dark); /* Borde oscuro */
            }

            /* Menú de Navegación - Mantenemos tus estilos originales */
            .menu-list { list-style: none; padding: 15px 10px; margin: 0; }
            .menu-item { margin-bottom: 8px; }

            .menu-link {
                display: flex;
                align-items: center;
                padding: 12px 15px;
                color: #94a3b8 !important; /* Tu color de texto original */
                text-decoration: none;
                border-radius: 8px;
                transition: all 0.2s;
            }

            .menu-link i { font-size: 1.2rem; margin-right: 15px; width: 25px; text-align: center; }

            /* Hover y Activo con tus estilos originales */
            .menu-link:hover, .menu-item.active .menu-link {
                background: rgba(255,255,255,0.1);
                color: white !important;
            }

            .menu-item.active .menu-link {
                border-left: 4px solid var(--accent-color);
                background: rgba(76, 124, 243, 0.1);
            }

            /* Main Content Area */
            .main-content {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                background-color: var(--body-bg);
            }

            .top-bar {
                height: 60px;
                background: #0b1426; /* Barra superior oscura */
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 25px;
                border-bottom: 1px solid var(--border-dark); /* Borde oscuro */
            }

            .card-custom {
                background: #0b1426; /* Fondo oscuro para la tarjeta de contenido */
                border-radius: 12px;
                padding: 20px;
                border: 1px solid var(--border-dark); /* Borde oscuro */
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            }

            /* Ajuste para el texto de perfil en la top-bar */
            .user-profile span {
                color: #94a3b8 !important;
            }
        </style>

        <div class="admin-wrapper">
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h:link outcome="/admin/index.xhtml" styleClass="logo-text">
                        <i class="pi pi-send"></i> <span>SKY-ADMIN</span>
                    </h:link>
                </div>

                <ul class="menu-list">
                    <li class="menu-item #{view.viewId.contains('index') ? 'active' : ''}">
                        <h:link outcome="/admin/index.xhtml" styleClass="menu-link">
                            <i class="pi pi-map"></i>
                            <span>Gestión de Vuelos</span>
                        </h:link>
                    </li>
                    <li class="menu-item #{view.viewId.contains('itinerario') ? 'active' : ''}">
                        <h:link outcome="/admin/itinerario/itinerario.xhtml" styleClass="menu-link">
                            <i class="pi pi-calendar-plus"></i>
                            <span>Itinerarios</span>
                        </h:link>
                    </li>
                    <li class="menu-item">
                        <h:link outcome="/admin/usuarios.xhtml" styleClass="menu-link">
                            <i class="pi pi-users"></i>
                            <span>Pasajeros</span>
                        </h:link>
                    </li>
                </ul>
            </aside>

            <div class="main-content">
                <header class="top-bar">
                    <p:commandLink onclick="toggleSidebar()" styleClass="p-mr-3">
                        <i class="pi pi-bars" style="font-size: 1.3rem; color: #64748b;"></i>
                    </p:commandLink>

                    <div class="user-profile" style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-weight: 500; color: #475569;">Admin Aerolínea</span>
                        <p:avatar icon="pi pi-user" styleClass="p-mr-2" shape="circle" />
                    </div>
                </header>

                <main class="view-container">
                    <div class="card-custom">
                        <ui:insert name="contenido-admin"/>
                    </div>
                </main>
            </div>
        </div>

        <script>
            function toggleSidebar() {
                document.getElementById("sidebar").classList.toggle("collapsed");
            }
        </script>
    </ui:define>
</ui:composition>
