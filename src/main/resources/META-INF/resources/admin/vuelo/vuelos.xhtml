<?xml version="1.0" encoding="UTF-8"?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/template/main.xhtml">
    <h:outputStylesheet library="primefaces" name="themes/saga/theme.css"/>

    <ui:define name="contenido">

        <h1>Próximos Vuelos</h1>

        <!-- Colocamos un formulario alrededor de la tabla para asegurar que los botones se procesen correctamente -->
        <h:form id="vueloForm">

            <p:dataTable value="#{vueloBean.vuelos}" var="vuelo"
                         responsiveLayout="scroll"
                         styleClass="table"
                         rowIndexVar="index"
                         expandableRowGroups="true"
                         rowKey="#{vuelo.idVuelo}">
                <p:column style="width:2rem" ariaHeaderText="Detalles">
                    <p:rowToggler />
                </p:column>

                <p:column headerText="N° Vuelo">
                    #{vuelo.numeroVuelo}
                </p:column>

                <p:column headerText="Fecha Salida">
                    <h:outputText value="#{vuelo.fechaHoraSalida}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Fecha Llegada">
                    <h:outputText value="#{vuelo.fechaHoraLlegada}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Acciones" styleClass="text-center">
                    <!-- Botón para Editar dentro del formulario -->
                    <p:commandButton value="Editar"
                                     icon="pi pi-pencil"
                                     styleClass="p-button-warning"
                                     action="#{vueloBean.editarVuelo(vuelo)}"
                                     update="vueloForm"
                                     ajax="true"/>
                </p:column>

                <p:rowExpansion>
                    <p:panelGrid columns="1" style="width:100%">
                        <p:dataTable value="#{vuelo.segmentoVuelos}" var="segmento"
                                     styleClass="nested-table">

                            <p:column headerText="Orden">
                                #{segmento.ordenSegmento}
                            </p:column>
                            <p:column headerText="Hora Salida">
                                <h:outputText value="#{segmento.horaSalida}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Hora Llegada">
                                <h:outputText value="#{segmento.horaLlegada}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Origen">
                                #{segmento.aeropuertoOrigen.codigoIata}
                            </p:column>
                            <p:column headerText="Destino">
                                #{segmento.aeropuertoDestino.codigoIata}
                            </p:column>

                        </p:dataTable>
                    </p:panelGrid>
                </p:rowExpansion>

            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
