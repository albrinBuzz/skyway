<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <style type="text/css">
        /* Estilos de Insignias (Badges) para estados */
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-ontime { background: #DCFCE7; color: #166534; }
        .status-delayed { background: #FEE2E2; color: #991B1B; }

        /* Ajustes de la tabla anidada */
        .nested-table { margin: 15px 0; border: 1px solid #e2e8f0; }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .ui-datatable-header {
            background: white !important;
            border: none !important;
            text-align: left !important;
        }
    </style>

    <div class="header-container">
        <h2 style="margin:0; color: #1e293b;">Panel de Operaciones de Vuelo</h2>
        <p:button outcome="/admin/vuelo/vuelo.xhtml"
                  value="Nuevo Vuelo"
                  icon="pi pi-plus"
                  styleClass="ui-button-primary" />
    </div>

    <h:form id="vueloForm">
        <p:growl id="msgs" showDetail="true"/>

        <p:dataTable id="dt-vuelos" value="#{vueloBean.vuelos}" var="vuelo"
                     widgetVar="wvVuelos"
                     responsiveLayout="stack"
                     styleClass="ui-datatable-striped"
                     paginator="true" rows="10"
                     paginatorPosition="bottom"
                     rowKey="#{vuelo.idVuelo}"
                     emptyMessage="No se encontraron vuelos programados">

            <f:facet name="header">
                <div class="flex justify-content-end">
                    <span class="ui-input-icon-left">
                        <i class="pi pi-search" />
                        <p:inputText id="globalFilter" onkeyup="PF('wvVuelos').filter()" placeholder="Buscar vuelo..." />
                    </span>
                </div>
            </f:facet>

            <p:column style="width:3rem">
                <p:rowToggler />
            </p:column>

            <p:column headerText="N° Vuelo" sortBy="#{vuelo.numeroVuelo}" filterBy="#{vuelo.numeroVuelo}">
                <h:outputText value="#{vuelo.numeroVuelo}" style="font-weight: bold; color: #003580;"/>
            </p:column>

            <p:column headerText="Salida" sortBy="#{vuelo.fechaHoraSalida}">
                <div class="flex flex-column">
                    <h:outputText value="#{vuelo.fechaHoraSalida}" style="font-weight: 500;">
                        <f:convertDateTime pattern="dd MMM, yyyy" />
                    </h:outputText>
                    <small class="text-secondary">
                        <h:outputText value="#{vuelo.fechaHoraSalida}">
                            <f:convertDateTime pattern="hh:mm a" />
                        </h:outputText>
                    </small>
                </div>
            </p:column>

            <p:column headerText="Llegada" sortBy="#{vuelo.fechaHoraLlegada}">
                <h:outputText value="#{vuelo.fechaHoraLlegada}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                </h:outputText>
            </p:column>

            <p:column headerText="Estado" style="text-align: center">
                <span class="status-badge status-ontime">Confirmado</span>
            </p:column>

            <p:column headerText="Gestión" exportable="false" style="width: 12rem; text-align: center">
                <p:commandButton icon="pi pi-pencil"
                                 action="#{vueloBean.editarVuelo(vuelo)}"
                                 styleClass="ui-button-warning ui-button-flat p-mr-2"
                                 title="Editar" />

                <p:commandButton icon="pi pi-calendar"
                                 value="Turnos"
                                 action="#{vueloBean.verTurnos(vuelo)}"
                                 styleClass="ui-button-info ui-button-outlined ui-button-sm" />
            </p:column>

            <p:rowExpansion>
                <div class="p-3 shadow-1" style="background: #f8fafc; border-radius: 8px;">
                    <h4 style="margin-top:0"><i class="pi pi-directions p-mr-2"></i>Itinerario de Escalas</h4>
                    <p:dataTable value="#{vuelo.segmentoVuelos}" var="segmento" styleClass="nested-table ui-datatable-sm">
                        <p:column headerText="Orden" style="width: 50px">#{segmento.ordenSegmento}</p:column>

                        <p:column headerText="Origen">
                            <i class="pi pi-upload p-mr-1" style="font-size: 0.8rem; color: #3b82f6;"></i>
                            <strong>#{segmento.aeropuertoOrigen.codigoIata}</strong>
                        </p:column>

                        <p:column headerText="Destino">
                            <i class="pi pi-download p-mr-1" style="font-size: 0.8rem; color: #10b981;"></i>
                            <strong>#{segmento.aeropuertoDestino.codigoIata}</strong>
                        </p:column>

                        <p:column headerText="Horarios">
                            <h:outputText value="#{segmento.horaSalida}"><f:convertDateTime pattern="HH:mm"/></h:outputText>
                            -
                            <h:outputText value="#{segmento.horaLlegada}"><f:convertDateTime pattern="HH:mm"/></h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
            </p:rowExpansion>
        </p:dataTable>
    </h:form>

</ui:composition>
