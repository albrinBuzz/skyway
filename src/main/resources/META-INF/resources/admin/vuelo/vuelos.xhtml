<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <style type="text/css">
        /* --- PALETA CORPORATIVA OFICIAL SKYWAY --- */
        :root {
            --deep-space: #080e1a;
            --midnight-blue: #0b1426;
            --slate-glass: #1e293b;
            --border-ui: #334155;

            --cyber-cyan: #00d1ff;
            --aviation-blue: #4c7cf3;
            --aviation-hover: #3b68d6;
            --glow-white: #f8fafc;
            --text-dim: #94a3b8;

            --status-ontime-bg: rgba(76, 124, 243, 0.12);
            --status-ontime-border: #4c7cf3;
            --status-ontime-text: #f8fafc;
        }

        .ops-container {
            padding: 12px 0;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--slate-glass);
            padding-bottom: 16px;
        }

        .header-container h2 {
            color: var(--glow-white) !important;
            font-size: 22px !important;
            font-weight: 600 !important;
            margin: 0 !important;
        }

        /* --- CONTENEDOR DE TABLA SOBRIO --- */
        .skyway-ops-table {
            background-color: var(--midnight-blue) !important;
            border: 1px solid var(--slate-glass) !important;
            border-radius: 8px !important;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Buscador Superior */
        .skyway-ops-table .ui-datatable-header {
            background-color: var(--midnight-blue) !important;
            padding: 14px 18px !important;
            border-bottom: 1px solid var(--slate-glass) !important;
        }

        /* Encabezado de Columnas en Deep Space */
        .skyway-ops-table thead th {
            background-color: var(--deep-space) !important;
            color: var(--text-dim) !important;
            text-transform: uppercase !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            letter-spacing: 0.8px !important;
            padding: 12px 16px !important;
            border: none !important;
            border-bottom: 1px solid var(--slate-glass) !important;
        }

        /* Ocultar input de filtro en cabeceras de columna */
        .skyway-ops-table thead th .ui-column-filter {
            display: none !important;
        }

        /* Celdas y Filas */
        .skyway-ops-table tbody td,
        .skyway-ops-table tbody tr {
            background-color: var(--midnight-blue) !important;
            color: var(--glow-white) !important;
            padding: 14px 16px !important;
            border: none !important;
            border-bottom: 1px solid var(--slate-glass) !important;
        }

        /* Hover de Filas (Gris Slate Vidrio) */
        .skyway-ops-table tbody tr:hover,
        .skyway-ops-table tbody tr:hover td {
            background-color: var(--slate-glass) !important;
        }

        /* --- PAGINADOR INTEGRADO A LA MARCA --- */
        .skyway-ops-table .ui-paginator {
            background-color: var(--deep-space) !important;
            border: none !important;
            border-top: 1px solid var(--slate-glass) !important;
            padding: 10px !important;
        }

        .skyway-ops-table .ui-paginator .ui-paginator-page,
        .skyway-ops-table .ui-paginator .ui-paginator-first,
        .skyway-ops-table .ui-paginator .ui-paginator-prev,
        .skyway-ops-table .ui-paginator .ui-paginator-next,
        .skyway-ops-table .ui-paginator .ui-paginator-last {
            background-color: var(--midnight-blue) !important;
            color: var(--text-dim) !important;
            border: 1px solid var(--border-ui) !important;
            border-radius: 4px !important;
            font-weight: 500 !important;
        }

        .skyway-ops-table .ui-paginator .ui-paginator-page:hover {
            color: var(--glow-white) !important;
            border-color: var(--aviation-blue) !important;
        }

        /* Pagina activa en Aviation Blue */
        .skyway-ops-table .ui-paginator .ui-paginator-page.ui-state-active {
            background-color: var(--aviation-blue) !important;
            color: #ffffff !important;
            border-color: var(--aviation-blue) !important;
        }

        /* BADGES CORPORATIVOS DE ESTADO */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-ontime {
            background: var(--status-ontime-bg) !important;
            color: var(--status-ontime-text) !important;
            border: 1px solid var(--status-ontime-border) !important;
        }

        /* BUSCADOR */
        .search-input {
            background: var(--deep-space) !important;
            border: 1px solid var(--border-ui) !important;
            color: var(--glow-white) !important;
            border-radius: 6px !important;
            padding: 6px 12px 6px 32px !important;
            font-size: 13px !important;
            width: 240px;
        }

        .search-input:focus {
            border-color: var(--aviation-blue) !important;
            box-shadow: none !important;
        }

        /* EXPANSIONES / ITINERARIOS */
        .skyway-ops-table .p-rowExpansion > td {
            background: var(--deep-space) !important;
            padding: 16px !important;
        }

        .itinerary-card {
            background: var(--midnight-blue);
            border: 1px solid var(--slate-glass);
            border-radius: 6px;
            padding: 16px;
        }

        .nested-table.ui-datatable,
        .nested-table.ui-datatable tbody td {
            background: transparent !important;
            border: none !important;
        }

        .nested-table.ui-datatable thead th {
            background: var(--deep-space) !important;
            border-bottom: 1px solid var(--slate-glass) !important;
        }

        /* BOTONES DE ACCIÓN */
        .btn-new {
            background: var(--aviation-blue) !important;
            border: none !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            color: #ffffff !important;
            font-size: 13px !important;
            padding: 6px 16px !important;
        }

        .btn-new:hover {
            background: var(--aviation-hover) !important;
        }

        .btn-turns {
            border: 1px solid var(--border-ui) !important;
            background: transparent !important;
            color: var(--glow-white) !important;
            border-radius: 4px !important;
            font-size: 12px !important;
        }

        .btn-turns:hover {
            background: var(--aviation-blue) !important;
            border-color: var(--aviation-blue) !important;
            color: #ffffff !important;
        }

        .ui-row-toggler {
            color: var(--text-dim) !important;
        }
        .ui-row-toggler:hover {
            color: var(--glow-white) !important;
        }
    </style>

    <div class="ops-container">
        <!-- CABECERA DE OPERACIONES -->
        <div class="header-container">
            <h2>Operaciones de Vuelo</h2>
            <p:button outcome="/admin/vuelo/vuelo.xhtml"
                      value="Nuevo Vuelo"
                      icon="pi pi-plus"
                      styleClass="btn-new" />
        </div>

        <h:form id="vueloForm">
            <p:growl id="msgs" showDetail="true"/>

            <p:dataTable id="dt-vuelos"
                         value="#{vueloBean.vuelos}"
                         var="vuelo"
                         widgetVar="wvVuelos"
                         responsiveLayout="stack"
                         styleClass="skyway-ops-table"
                         paginator="true"
                         rows="10"
                         paginatorPosition="bottom"
                         rowKey="#{vuelo.idVuelo}"
                         emptyMessage="No se encontraron vuelos programados">

                <!-- HEADER CON BUSCADOR GLOBALES -->
                <f:facet name="header">
                    <div class="flex justify-content-end align-items-center">
                        <span class="ui-input-icon-left" style="position: relative;">
                            <i class="pi pi-search" style="color: var(--text-dim); position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 1;" />
                            <p:inputText id="globalFilter"
                                         onkeyup="PF('wvVuelos').filter()"
                                         placeholder="Buscar por vuelo, ruta..."
                                         styleClass="search-input" />
                        </span>
                    </div>
                </f:facet>

                <p:column style="width:3rem; text-align: center">
                    <p:rowToggler />
                </p:column>

                <p:column headerText="Vuelo" sortBy="#{vuelo.numeroVuelo}">
                    <h:outputText value="#{vuelo.numeroVuelo}" style="font-weight: 700; color: var(--glow-white); font-size: 14px;"/>
                </p:column>

                <p:column headerText="Salida" sortBy="#{vuelo.fechaHoraSalida}">
                    <h:outputText value="#{vuelo.fechaHoraSalida}" style="font-weight: 500; font-size: 13px;">
                        <f:convertDateTime pattern="dd/MM/yyyy - HH:mm 'hrs'"
                                           type="both"
                                           timeZone="America/Santiago" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Llegada" sortBy="#{vuelo.fechaHoraLlegada}">
                    <h:outputText value="#{vuelo.fechaHoraLlegada}" style="font-weight: 500; font-size: 13px;">
                        <f:convertDateTime pattern="dd/MM/yyyy - HH:mm 'hrs'"
                                           type="both"
                                           timeZone="America/Santiago" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Estado" style="text-align: center; width: 160px;">
                    <span class="status-badge status-ontime">
                        <i class="pi pi-check-circle" style="font-size: 11px"></i> #{vuelo.estadoVuelo != null ? vuelo.estadoVuelo.descripcion : 'Programado'}
                    </span>
                </p:column>

                <p:column headerText="Gestión" style="width: 140px; text-align: center">
                    <div class="flex gap-2 justify-content-center">
                        <p:commandButton icon="pi pi-pencil"
                                         action="#{vueloBean.editarVuelo(vuelo)}"
                                         styleClass="ui-button-flat ui-button-plain"
                                         style="color: var(--text-dim);"
                                         title="Editar Vuelo" />

                        <p:commandButton value="Turnos"
                                         icon="pi pi-calendar"
                                         action="#{vueloBean.verTurnos(vuelo)}"
                                         styleClass="btn-turns ui-button-sm" />
                    </div>
                </p:column>

                <!-- SUB-DESPLEGABLE CON DETALLES Y LOGÍSTICA DE ESCALAS -->
                <p:rowExpansion>
                    <div class="itinerary-card">
                        <h4 style="margin:0 0 12px 0; display: flex; align-items: center; gap: 8px; color: var(--glow-white); font-size: 14px; font-weight: 600;">
                            <i class="pi pi-map-marker" style="color: var(--text-dim)"></i>
                            Itinerario y Escalas Logísticas
                        </h4>

                        <p:dataTable value="#{vuelo.segmentoVuelos}" var="segmento" styleClass="nested-table ui-datatable-sm">
                            <p:column headerText="#" style="width: 40px; text-align: center; color: var(--text-dim)">
                                #{segmento.ordenSegmento}°
                            </p:column>

                            <p:column headerText="Origen">
                                <span style="font-weight: 700; color: var(--glow-white)">#{segmento.aeropuertoOrigen.codigoIata}</span>
                                <h:outputText value=" - #{segmento.aeropuertoOrigen.nombreAeropuerto}" style="font-size: 12px; color: var(--text-dim); margin-left: 4px;"/>
                            </p:column>

                            <p:column style="width: 30px; text-align: center;">
                                <i class="pi pi-arrow-right" style="color: var(--text-dim); font-size: 11px;"></i>
                            </p:column>

                            <p:column headerText="Destino">
                                <span style="font-weight: 700; color: var(--glow-white)">#{segmento.aeropuertoDestino.codigoIata}</span>
                                <h:outputText value=" - #{segmento.aeropuertoDestino.nombreAeropuerto}" style="font-size: 12px; color: var(--text-dim); margin-left: 4px;"/>
                            </p:column>

                            <p:column headerText="Horario Operativo">
                                <div style="font-size: 13px; font-weight: 500;">
                                    <h:outputText value="#{segmento.horaSalida}">
                                        <f:convertDateTime pattern="HH:mm" type="both" timeZone="America/Santiago"/>
                                    </h:outputText>
                                    <span style="margin: 0 6px; color: var(--text-dim)">➔</span>
                                    <h:outputText value="#{segmento.horaLlegada}">
                                        <f:convertDateTime pattern="HH:mm" type="both" timeZone="America/Santiago"/>
                                    </h:outputText>
                                    <span style="font-size: 11px; color: var(--text-dim); margin-left: 4px;">hrs</span>
                                </div>
                            </p:column>
                        </p:dataTable>
                    </div>
                </p:rowExpansion>
            </p:dataTable>
        </h:form>
    </div>

</ui:composition>
