<?xml version="1.0" encoding="UTF-8"?>
<ui:composition lang="es"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/template/main.xhtml">

    <ui:define name="head">
        <title>¡Ups, algo salió mal! - SkyWay</title>
        <style type="text/css">
            .error-page-container {
                max-width: 600px;
                margin: 60px auto;
                padding: 0 15px;
            }
            .error-card {
                background-color: #0F172A !important;
                border: 1px solid #1E293B !important;
                border-radius: 12px !important;
                padding: 40px !important;
                box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.6) !important;
                text-align: center;
            }
            .error-icon-wrapper {
                width: 75px;
                height: 75px;
                background: rgba(239, 68, 68, 0.12);
                border: 1px solid rgba(239, 68, 68, 0.3);
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 20px;
            }
            .error-title {
                color: #F8FAFC;
                font-size: 1.6rem;
                font-weight: 700;
                margin-bottom: 12px;
            }
            .error-description {
                color: #94A3B8;
                font-size: 0.95rem;
                line-height: 1.6;
                margin-bottom: 30px;
            }
            .error-actions-grid {
                display: flex;
                justify-content: center;
                gap: 15px;
            }
        </style>
    </ui:define>

    <ui:define name="contenido">
        <div class="error-page-container">
            <div class="error-card">

                <div class="error-icon-wrapper">
                    <i class="pi pi-exclamation-triangle" style="font-size: 2.2rem; color: #F87171;"></i>
                </div>

                <h1 class="error-title">¡Ups! Ocurrió un inconveniente</h1>
                <p class="error-description">
                    Algo no salió como esperábamos en el sistema. No te preocupes, nuestros ingenieros ya han recibido el reporte automático en los registros de vuelo para solucionarlo.
                </p>

                <h:form>
                    <div class="error-actions-grid">
                        <p:button value="Reintentar"
                                  icon="pi pi-refresh"
                                  styleClass="ui-button-outlined ui-button-info py-2 px-4"
                                  onclick="window.history.back(); return false;"
                                  style="border-color: #3B82F6 !important; color: #60A5FA !important;" />

                        <p:button value="Ir al Inicio"
                                  outcome="/home/index.xhtml"
                                  icon="pi pi-home"
                                  styleClass="ui-button-primary py-2 px-4"
                                  style="background-color: #2563EB !important; border-color: #2563EB !important;" />
                    </div>
                </h:form>

            </div>
        </div>
    </ui:define>

</ui:composition>
