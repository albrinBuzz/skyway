<?xml version="1.0" encoding="UTF-8"?>

<ui:composition lang="es"
	  xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:fs="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      template="/template/main.xhtml">

    <h:head>
        <title>Próximos Vuelos</title>
        <style>
            /* Estructura General */
             body {
                 font-family: 'Roboto', sans-serif;
                 background-color: #f8f9fa;
                 margin: 0;
                 padding: 0;
             }

             .search-bar {
                 background-color: #343a40;
                 padding: 50px 0;
                 color: white;
                 text-align: center;
             }

             .search-bar h2 {
                 font-size: 2rem;
                 color: #fff;
                 font-weight: 700;
             }

             /* Tarjetas de Vuelo */
             .product-grid-item {
                 border-radius: 15px;
                 box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                 overflow: hidden;
                 background: white;
                 transition: transform 0.3s ease, box-shadow 0.3s ease;
                 margin-bottom: 20px;
                 margin-right: 15px;
                 cursor: pointer;
                 max-width: 350px;
             }

             .product-grid-item:hover {
                 transform: translateY(-10px);
                 box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
             }

             .product-grid-item-top {
                 background-color: #007bff;
                 color: white;
                 padding: 15px;
                 display: flex;
                 justify-content: space-between;
                 align-items: center;
             }

             .product-category-icon {
                 font-size: 1.5rem;
                 color: white;
             }

             .product-badge {
                 font-size: 0.875rem;
                 color: #fff;
                 background-color: #28a745;
                 border-radius: 5px;
                 padding: 5px 10px;
             }

             .product-grid-item-content {
                 padding: 15px;
                 text-align: center;
             }

             .product-name {
                 font-size: 1.5rem;
                 color: #007bff;
                 font-weight: 600;
                 margin-bottom: 10px;
             }

             .product-description {
                 font-size: 1rem;
                 color: #6c757d;
                 margin-bottom: 15px;
             }

             .product-price {
                 font-size: 1.25rem;
                 font-weight: 700;
                 color: #28a745;
                 margin-top: 10px;
             }

             .product-grid-item-bottom {
                 display: flex;
                 justify-content: space-between;
                 align-items: center;
                 padding: 15px;
                 background-color: #f8f9fa;
             }

             .product-list-action {
                 display: flex;
                 align-items: center;
                 justify-content: space-between;
             }

             .product-list-action button {
                 background-color: #007bff;
                 color: white;
                 border: none;
                 padding: 8px 15px;
                 font-weight: 600;
                 transition: background-color 0.3s;
                 border-radius: 5px;
             }

             .product-list-action button:hover {
                 background-color: #0056b3;
             }

             /* Paginación */
             .ui-paginator {
                 display: flex;
                 justify-content: center;
                 margin-top: 20px;
             }

             /* Responsividad */
             @media (max-width: 768px) {
                 .product-grid-item {
                     width: 100%;
                 }
             }


        </style>
    </h:head>


	  <ui:define name="contenido">

		<div class="container-fluid search-bar py-5">
            <div class="container">
                <!-- Título Principal -->
                <h2 class="text-center mb-4 text-primary">Buscar Vuelos</h2>

                <!-- Tarjeta principal de búsqueda -->
                <div class="card shadow-lg p-4">
                    <!-- Tabs -->
                    <ul class="nav nav-tabs" id="searchTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <a class="nav-link active" id="one-way-tab" data-bs-toggle="tab" href="#one-way" role="tab" aria-controls="one-way" aria-selected="true">
                                <i class="bi bi-arrow-right-circle"></i> Solo Ida
                            </a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="round-trip-tab" data-bs-toggle="tab" href="#round-trip" role="tab" aria-controls="round-trip" aria-selected="false">
                                <i class="bi bi-arrow-left-right"></i> Ida y Vuelta
                            </a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="airline-tab" data-bs-toggle="tab" href="#airline" role="tab" aria-controls="airline" aria-selected="false">
                                <i class="bi bi-airplane-engines"></i> Aerolínea
                            </a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="price-tab" data-bs-toggle="tab" href="#price" role="tab" aria-controls="price" aria-selected="false">
                                <i class="bi bi-cash"></i> Precio
                            </a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="duration-tab" data-bs-toggle="tab" href="#duration" role="tab" aria-controls="duration" aria-selected="false">
                                <i class="bi bi-clock"></i> Duración del Vuelo
                            </a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="stops-tab" data-bs-toggle="tab" href="#stops" role="tab" aria-controls="stops" aria-selected="false">
                                <i class="bi bi-stopwatch"></i> Escalas
                            </a>
                        </li>
                    </ul>



                    <!-- Contenido de Tabs -->

                    <div class="tab-content mt-3" id="searchTabsContent">





                        <!-- 🔹 FORMULARIO: Solo Ida -->
                        <div class="tab-pane fade show active" id="one-way" role="tabpanel" aria-labelledby="one-way-tab">
                            <h:form id="formOneWay">

                                <!-- Selección de Aeropuertos -->
                                <div class="row mb-4">
                                    <!-- Aeropuerto de Origen -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="aeropuertoSalida" value="Aeropuerto de salida" />
                                        <p:autoComplete id="aeropuertoSalida"
                                                        value="#{itinerarioBean.codigoIataOrigen}"
                                                        completeMethod="#{itinerarioBean.buscarAeropuertos}"
                                                        var="aeropuerto"
                                                        itemLabel="#{aeropuerto.ciudad.nombre} - #{aeropuerto.nombreAeropuerto} (#{aeropuerto.codigoIata})"
                                                        itemValue="#{aeropuerto.codigoIata}"
                                                        forceSelection="true"
                                                        dropdown="true"
                                                        placeholder="Escribe para buscar aeropuerto"
                                                        styleClass="w-100"
                                                        required="true"
                                                        requiredMessage="Debe seleccionar un aeropuerto de salida" />
                                    </div>

                                    <!-- Aeropuerto de Destino -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="aeropuertoLlegada" value="Aeropuerto de llegada" />
                                        <p:autoComplete id="aeropuertoLlegada"
                                                        value="#{itinerarioBean.codigoIataDestino}"
                                                        completeMethod="#{itinerarioBean.buscarAeropuertos}"
                                                        var="aeropuerto"
                                                        itemLabel="#{aeropuerto.ciudad.nombre} - #{aeropuerto.nombreAeropuerto} (#{aeropuerto.codigoIata})"
                                                        itemValue="#{aeropuerto.codigoIata}"
                                                        forceSelection="true"
                                                        dropdown="true"
                                                        placeholder="Escribe para buscar aeropuerto"
                                                        styleClass="w-100"
                                                        required="true"
                                                        requiredMessage="Debe seleccionar un aeropuerto de llegada" />
                                    </div>
                                </div>

                                <!-- Fecha de salida -->
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="fechaSalida" value="Fecha de salida" />
                                        <p:datePicker id="fechaSalida"
                                                      value="#{itinerarioBean.fechaIda}"
                                                      showIcon="true"
                                                      required="true"
                                                      requiredMessage="Debe seleccionar la fecha de salida"
                                                      pattern="dd/MM/yyyy"
                                                      readonlyInput="true"
                                                      styleClass="w-100"
                                                      mindate="#{java.time.LocalDate.now()}" />
                                    </div>
                                </div>
                                <!-- Cantidad de Pasajeros -->
                                <div class="row mb-4">
                                    <div class="col-md-4 mb-3">
                                        <h:outputLabel for="adultos" value="Pasajeros" styleClass="form-label" />
                                        <p:spinner id="adultos"
                                                   value="#{itinerarioBean.adultos}"
                                                   min="1"
                                                   max="9"
                                                   stepFactor="1"
                                                   styleClass="w-100"
                                                   size="2"
                                                   required="true"
                                                   requiredMessage="Debe seleccionar al menos un adulto" />
                                        <h:message for="adultos" styleClass="text-danger" />
                                    </div>
                                </div>


                                <!-- Botón de búsqueda -->
                                <div class="text-center mt-4">
                                    <p:commandButton value="Buscar Vuelos"
                                                     action="#{itinerarioBean.buscarVuelosSoloIda}"
                                                     styleClass="btn btn-primary btn-lg"
                                                     icon="pi pi-search"
                                                     update="@form messages" />
                                </div>

                                <!-- Mensajes de validación -->
                                <p:messages id="messages" showSummary="true" showDetail="false" closable="true" />
                            </h:form>
                        </div>


                        <!-- 🔹 FORMULARIO: Ida y Vuelta -->
                        <div class="tab-pane fade" id="round-trip" role="tabpanel" aria-labelledby="round-trip-tab">
                            <h:form id="formRoundTrip">

                                <!-- Selección de Aeropuertos -->
                                <div class="row mb-4">
                                    <!-- Aeropuerto de Origen -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="origenRT" value="Desde (Aeropuerto de salida)" />
                                        <p:selectOneMenu id="origenRT" value="#{itinerarioBean.codigoIataOrigen}" required="true"
                                                         requiredMessage="Debe seleccionar un aeropuerto de salida" styleClass="w-100">
                                            <f:selectItem itemLabel="Seleccione un aeropuerto" itemValue="" />
                                            <f:selectItems value="#{itinerarioBean.aeropuertos}" var="aeropuerto"
                                                           itemLabel="#{aeropuerto.ciudad.nombre} - #{aeropuerto.nombreAeropuerto} (#{aeropuerto.codigoIata})"
                                                           itemValue="#{aeropuerto.codigoIata}" />
                                        </p:selectOneMenu>
                                    </div>

                                    <!-- Aeropuerto de Destino -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="destinoRT" value="Hasta (Aeropuerto de llegada)" />
                                        <p:selectOneMenu id="destinoRT" value="#{itinerarioBean.codigoIataDestino}" required="true"
                                                         requiredMessage="Debe seleccionar un aeropuerto de llegada" styleClass="w-100">
                                            <f:selectItem itemLabel="Seleccione un aeropuerto" itemValue="" />
                                            <f:selectItems value="#{itinerarioBean.aeropuertos}" var="aeropuerto"
                                                           itemLabel="#{aeropuerto.ciudad.nombre} - #{aeropuerto.nombreAeropuerto} (#{aeropuerto.codigoIata})"
                                                           itemValue="#{aeropuerto.codigoIata}" />
                                        </p:selectOneMenu>
                                    </div>
                                </div>

                                <!-- Fechas -->
                                <div class="row mb-4">
                                    <!-- Fecha de Ida -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="fechaIda" value="Fecha de salida" />
                                        <p:datePicker id="fechaIda" value="#{itinerarioBean.fechaIda}" showIcon="true"
                                                      required="true" requiredMessage="Debe seleccionar la fecha de salida"
                                                      pattern="dd/MM/yyyy" readonlyInput="true" styleClass="w-100" />
                                    </div>

                                    <!-- Fecha de Retorno -->
                                    <div class="col-md-6 mb-3">
                                        <h:outputLabel for="fechaRetorno" value="Fecha de regreso" />
                                        <p:datePicker id="fechaRetorno" value="#{itinerarioBean.fechaRetorno}" showIcon="true"
                                                      required="true" requiredMessage="Debe seleccionar la fecha de regreso"
                                                      pattern="dd/MM/yyyy" readonlyInput="true" styleClass="w-100" />
                                    </div>
                                </div>

                                <!-- Botón de búsqueda -->
                                <div class="text-center mt-4">
                                    <p:commandButton value="Buscar Vuelos"
                                                     action="#{itinerarioBean.buscarVuelosIdaYVuelta}"
                                                     styleClass="btn btn-primary btn-lg"
                                                     icon="pi pi-search"
                                                     update="@form messages" />
                                </div>

                                <!-- Mensajes de validación -->
                                <p:messages id="messages" showSummary="true" showDetail="false" closable="true" />
                            </h:form>
                        </div>
                    </div>


                </div>
            </div>
        </div>










    </ui:define>

</ui:composition>
