<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/template/main.xhtml">

    <ui:define name="contenido">
        <style type="text/css">
            :root {
                --deep-space: #080e1a;
                --midnight-blue: #0b1426;
                --slate-glass: #1e293b;
                --border-ui: #334155;

                --cyber-cyan: #00d1ff;
                --aviation-blue: #4c7cf3;
                --aviation-hover: #3b68d6;
                --glow-white: #f8fafc;
                --text-dim: #94a3b8;
            }

            .login-wrapper {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: calc(100vh - 160px);
                background-color: var(--deep-space);
                padding: 40px 20px;
            }

            .login-container {
                background-color: var(--midnight-blue);
                border: 1px solid var(--slate-glass);
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                width: 100%;
                max-width: 420px;
                text-align: center;
            }

            .login-logo-text {
                font-size: 26px;
                font-weight: 800;
                color: var(--cyber-cyan);
                letter-spacing: 1px;
                margin-bottom: 8px;
                display: inline-block;
            }

            .login-title {
                font-size: 22px;
                font-weight: 700;
                margin: 10px 0 6px 0;
                color: var(--glow-white);
            }

            .login-subtitle {
                font-size: 13px;
                color: var(--text-dim);
                margin-bottom: 28px;
            }

            .form-field {
                margin-bottom: 20px;
                text-align: left;
            }

            .form-field label {
                display: block;
                font-size: 13px;
                font-weight: 500;
                color: var(--glow-white);
                margin-bottom: 8px;
            }

            .input-container {
                position: relative;
                display: flex;
                align-items: center;
            }

            .input-container i {
                position: absolute;
                left: 14px;
                color: var(--text-dim);
                font-size: 14px;
                z-index: 2;
                pointer-events: none;
            }

            .input-field {
                width: 100% !important;
                padding: 10px 12px 10px 40px !important;
                background-color: var(--deep-space) !important;
                border: 1px solid var(--border-ui) !important;
                border-radius: 6px !important;
                font-size: 14px !important;
                color: var(--glow-white) !important;
                box-sizing: border-box;
            }

            .input-field:focus {
                border-color: var(--aviation-blue) !important;
                box-shadow: 0 0 0 2px rgba(76, 124, 243, 0.2) !important;
            }

            .btn-login {
                width: 100% !important;
                padding: 11px !important;
                background: var(--aviation-blue) !important;
                border: none !important;
                border-radius: 6px !important;
                font-size: 14px !important;
                font-weight: 600 !important;
                color: #ffffff !important;
                margin-top: 10px;
                cursor: pointer;
            }

            .btn-login:hover {
                background: var(--aviation-hover) !important;
            }

            .forgot-password {
                display: inline-block;
                margin-top: 20px;
                font-size: 13px;
                color: var(--cyber-cyan);
                text-decoration: none;
            }

            .forgot-password:hover {
                text-decoration: underline;
            }
        </style>

        <div class="login-wrapper">
            <div class="login-container">
                <!-- Identidad SkyWay -->
                <div class="login-logo-text">
                    <i class="pi pi-send" style="margin-right: 6px;"></i>SKYWAY
                </div>

                <h1 class="login-title">Iniciar sesión</h1>
                <p class="login-subtitle">Accede a tu cuenta de usuario</p>

                <h:form id="frmLogin">
                    <p:messages id="msgs" globalOnly="true" showDetail="true" closable="true"/>

                    <!-- Usuario -->
                    <div class="form-field">
                        <h:outputLabel for="username" value="Usuario o Correo" />
                        <div class="input-container">
                            <i class="pi pi-user"></i>
                            <h:inputText id="username"
                                         value="#{loginBean.username}"
                                         required="true"
                                         requiredMessage="Ingresa tu usuario"
                                         styleClass="input-field"
                                         placeholder="ejemplo@skyway.cl" />
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="form-field">
                        <h:outputLabel for="password" value="Contraseña" />
                        <div class="input-container">
                            <i class="pi pi-lock"></i>
                            <h:inputSecret id="password"
                                           value="#{loginBean.password}"
                                           required="true"
                                           requiredMessage="Ingresa tu contraseña"
                                           styleClass="input-field"
                                           placeholder="••••••••" />
                        </div>
                    </div>

                    <p:commandButton value="Iniciar sesión"
                                     action="#{loginBean.login}"
                                     update="frmLogin"
                                     styleClass="btn-login" />

                    <div>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
