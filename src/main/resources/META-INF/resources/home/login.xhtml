<?xml version="1.0" encoding="UTF-8"?>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:sec="http://www.springframework.org/security/tags"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <title>Login</title>

    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1c92d2, #f2fcfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Contenedor del formulario de login */
        .login-container {
            background-color: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        /* Efecto de hover en el contenedor */
        .login-container:hover {
            transform: translateY(-10px);
        }

        /* Logo */
        .login-logo {
            width: 80px;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }

        /* Título */
        .login-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        /* Subtítulo */
        .login-subtitle {
            font-size: 16px;
            color: #777;
            margin-bottom: 30px;
        }

        /* Estilos para las etiquetas de entrada */
        .input-label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        /* Estilos para los campos de entrada */
        .input-field {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #f8f8f8;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        .input-field:focus {
            border-color: #1c92d2;
            background-color: #e0f7fa;
            box-shadow: 0 0 10px rgba(28, 146, 210, 0.2);
        }

        /* Icono de campo */
        .input-field::placeholder {
            color: #888;
        }

        /* Botón de login */
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #1c92d2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #146a92;
        }

        /* Mensaje de error */
        .error-message {
            font-size: 14px;
            color: red;
            margin-top: 10px;
        }

        /* Estilo para el enlace de olvido de contraseña */
        .forgot-password {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #1c92d2;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Estilo para iconos de los campos */
        .input-icon {
            position: absolute;
            top: 14px;
            left: 15px;
            color: #bbb;
            font-size: 18px;
        }

        /* Contenedor de input con icono */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        /* Animación de fade-in */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</h:head>
<h:body>
    <div class="login-container">
        <!-- Logo (opcional) -->
        <img src="https://www.clipartmax.com/png/small/354-3543373_spring-framework-logo-svg-png-download-java-spring.png" alt="Logo" class="login-logo" />
			
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Accede a tu cuenta para continuar</p>

        <h:form>
            <!-- Usuario -->
            <div class="input-group">
                <i class="input-icon fa fa-user"></i>
                <h:outputLabel for="username" value="Usuario" class="input-label" />
                <h:inputText id="username" value="#{loginBean.username}" required="true"
                             class="input-field" placeholder="Ingresa tu usuario" />
            </div>

            <!-- Contraseña -->
            <div class="input-group">
                <i class="input-icon fa fa-lock"></i>
                <h:outputLabel for="password" value="Contraseña" class="input-label" />
                <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                               class="input-field" placeholder="Ingresa tu contraseña" />
            </div>

            <h:commandButton value="Iniciar sesión" action="#{loginBean.login}" class="btn-login" />

            <h:messages globalOnly="true" style="color: red;" class="error-message" />

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </h:form>
    </div>

    <!-- Fuentes para iconos -->
    <h:outputScript name="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js" />
</h:body>
</html>
