<?xml version="1.0" encoding="UTF-8"?>
<ui:composition lang="es"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/template/main.xhtml">

    <ui:define name="head">
        <title>SkyWay | Registro de Usuario</title>
        <style type="text/css">
            /* ==========================================================================
               🎨 ESTILOS DARK THEME CORPORATIVO - REGISTRO SKYWAY
               ========================================================================== */
            .register-container {
                max-width: 820px;
                margin: 40px auto;
                background: #101B33 !important;
                border: 1px solid #1E3A5C !important;
                border-radius: 12px !important;
                padding: 32px !important;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4) !important;
            }

            .register-title {
                color: #FFFFFF !important;
                font-size: 1.5rem !important;
                font-weight: 700 !important;
                margin-bottom: 24px !important;
                border-bottom: 1px solid #1E293B !important;
                padding-bottom: 12px !important;
            }

            .section-header {
                color: #94A3B8 !important;
                font-size: 0.88rem !important;
                font-weight: 700 !important;
                text-transform: uppercase !important;
                letter-spacing: 0.8px !important;
                margin-top: 16px !important;
                margin-bottom: 12px !important;
            }

            /* Estilos de Inputs / Selects */
            .skyway-field-group {
                margin-bottom: 16px;
            }

            .skyway-label {
                display: block !important;
                color: #CBD5E1 !important;
                font-size: 0.85rem !important;
                font-weight: 600 !important;
                margin-bottom: 6px !important;
            }

            .register-container .ui-inputfield,
            .register-container .ui-selectonemenu,
            .register-container .ui-datepicker input {
                background: #11263F !important;
                border: 1px solid #1E3A5C !important;
                color: #E6EEF7 !important;
                border-radius: 6px !important;
                padding: 10px 12px !important;
                width: 100% !important;
            }

            .register-container .ui-inputfield:focus,
            .register-container .ui-selectonemenu:focus-within {
                border-color: #3B82F6 !important;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25) !important;
            }

            /* Botón de Acción Principal */
            .btn-skyway-register.ui-button {
                background: #2563EB !important;
                border: none !important;
                color: #FFFFFF !important;
                font-weight: 700 !important;
                padding: 14px !important;
                font-size: 1rem !important;
                border-radius: 8px !important;
                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3) !important;
                transition: background-color 0.2s ease !important;
            }

            .btn-skyway-register.ui-button:hover {
                background: #1D4ED8 !important;
            }

            /* Sobrescribir popups de PrimeFaces */
            body .ui-selectonemenu-panel,
            body .ui-datepicker {
                background-color: #0D172A !important;
                border: 1px solid #1E3A5C !important;
                color: #E6EEF7 !important;
            }

            body .ui-selectonemenu-panel .ui-selectonemenu-item {
                color: #CBD5E1 !important;
            }

            body .ui-selectonemenu-panel .ui-selectonemenu-item:hover,
            body .ui-selectonemenu-panel .ui-selectonemenu-item.ui-state-highlight {
                background-color: #1E3A5C !important;
                color: #FFFFFF !important;
            }
        </style>
    </ui:define>

    <ui:define name="contenido">
        <p:growl id="growl" showDetail="true" keepAlive="true" life="5000" />

        <div class="container">
            <div class="register-container">
                <div class="register-title d-flex align-items-center">
                    <i class="pi pi-user-plus text-primary me-2" style="font-size: 1.5rem;"></i>
                    Crear Cuenta de Pasajero
                </div>

                <h:form id="registroForm">

                    <!-- SECCIÓN 1: DATOS PERSONALES Y CUENTA -->
                    <div class="section-header">
                        <i class="pi pi-id-card me-1"></i> Información Personal y Acceso
                    </div>

                    <div class="row g-3">
                        <!-- RUT / Identificación principal -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="rutUsuario" value="RUT / Identificador de Cuenta" styleClass="skyway-label"/>
                            <p:inputText id="rutUsuario" value="#{usuarioBean.usuario.rut}" required="true"
                                         requiredMessage="El RUT es obligatorio"
                                         placeholder="Ej: 12345678-9"/>
                        </div>

                        <!-- Nombre -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="nombre" value="Nombre" styleClass="skyway-label"/>
                            <p:inputText id="nombre" value="#{usuarioBean.usuario.nombre}" required="true"
                                         requiredMessage="El nombre es obligatorio"
                                         placeholder="Ingresa tu nombre"/>
                        </div>

                        <!-- Apellido -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="apellido" value="Apellido" styleClass="skyway-label"/>
                            <p:inputText id="apellido" value="#{usuarioBean.usuario.apellido}" required="true"
                                         requiredMessage="El apellido es obligatorio"
                                         placeholder="Ingresa tu apellido"/>
                        </div>

                        <!-- Fecha Nacimiento -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="fechaNacimiento" value="Fecha de Nacimiento" styleClass="skyway-label"/>
                            <p:datePicker id="fechaNacimiento" value="#{usuarioBean.usuario.fechaNacimiento}"
                                          pattern="dd/MM/yyyy" monthNavigator="true" yearNavigator="true"
                                          yearRange="1930:2026" placeholder="DD/MM/AAAA" required="true"
                                          requiredMessage="La fecha de nacimiento es obligatoria"/>
                        </div>

                        <!-- Correo Electrónico -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="correoElectronico" value="Correo Electrónico" styleClass="skyway-label"/>
                            <p:inputText id="correoElectronico" value="#{usuarioBean.usuario.correoElectronico}" required="true"
                                         requiredMessage="El correo electrónico es obligatorio"
                                         placeholder="ejemplo@correo.com"/>
                        </div>

                        <!-- Teléfono -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="telefono" value="Teléfono" styleClass="skyway-label"/>
                            <p:inputMask id="telefono" mask="(99) 9999-9999" value="#{usuarioBean.usuario.telefono}"
                                         required="true" requiredMessage="El teléfono es obligatorio"
                                         placeholder="(56) 91234-5678"/>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: DOCUMENTACIÓN Y NACIONALIDAD -->
                    <div class="section-header my-3">
                        <i class="pi pi-globe me-1"></i> Documento de Viaje y Nacionalidad
                    </div>

                    <div class="row g-3">
                        <!-- Tipo de Documento -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="tipoDocumento" value="Tipo Documento" styleClass="skyway-label"/>
                            <p:selectOneMenu id="tipoDocumento" value="#{usuarioBean.tipoDocumento}" required="true"
                                             requiredMessage="Seleccione el tipo de documento">
                                <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                <f:selectItem itemLabel="Cédula de Identidad" itemValue="CEDULA"/>
                                <f:selectItem itemLabel="Pasaporte" itemValue="PASAPORTE"/>
                                <f:selectItem itemLabel="DNI Extranjero" itemValue="DNI"/>
                            </p:selectOneMenu>
                        </div>

                        <!-- Número de Documento / Pasaporte -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="documentoIdentidad" value="Número de Documento" styleClass="skyway-label"/>
                            <p:inputText id="documentoIdentidad" value="#{usuarioBean.usuario.documentoIdentidad}" required="true"
                                         requiredMessage="El número de documento es obligatorio"
                                         placeholder="N° Pasaporte o DNI"/>
                        </div>

                        <!-- Nacionalidad -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="nacionalidad" value="Nacionalidad" styleClass="skyway-label"/>
                            <p:selectOneMenu id="nacionalidad" value="#{usuarioBean.nacionalidad}" required="true"
                                             filter="true" filterMatchMode="contains"
                                             requiredMessage="Seleccione una nacionalidad">
                                <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                <f:selectItem itemLabel="Chilena" itemValue="Chilena"/>
                                <f:selectItem itemLabel="Argentina" itemValue="Argentina"/>
                                <f:selectItem itemLabel="Peruana" itemValue="Peruana"/>
                                <f:selectItem itemLabel="Colombiana" itemValue="Colombiana"/>
                                <f:selectItem itemLabel="Brasilera" itemValue="Brasilera"/>
                                <f:selectItem itemLabel="Uruguaya" itemValue="Uruguaya"/>
                                <f:selectItem itemLabel="Boliviana" itemValue="Boliviana"/>
                                <f:selectItem itemLabel="Ecuatoriana" itemValue="Ecuatoriana"/>
                                <f:selectItem itemLabel="Venezolana" itemValue="Venezolana"/>
                                <f:selectItem itemLabel="Española" itemValue="Española"/>
                                <f:selectItem itemLabel="Estadounidense" itemValue="Estadounidense"/>
                                <f:selectItem itemLabel="Mexicana" itemValue="Mexicana"/>
                                <f:selectItem itemLabel="Otra" itemValue="Otra"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: CONTRASEÑA -->
                    <div class="section-header my-3">
                        <i class="pi pi-lock me-1"></i> Seguridad
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="contrasena" value="Contraseña" styleClass="skyway-label"/>
                            <p:password id="contrasena" value="#{usuarioBean.usuario.contrasena}" required="true"
                                        toggleMask="true" requiredMessage="La contraseña es obligatoria"
                                        placeholder="••••••••"/>
                        </div>

                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="confirmarContrasena" value="Confirmar Contraseña" styleClass="skyway-label"/>
                            <p:password id="confirmarContrasena" value="#{usuarioBean.confirmarContrasena}" required="true"
                                        toggleMask="true" requiredMessage="Confirma tu contraseña"
                                        placeholder="••••••••"/>
                        </div>
                    </div>

                    <!-- BOTÓN PRINCIPAL -->
                    <div class="mt-4">
                        <p:commandButton value="Crear Cuenta de Pasajero" action="#{usuarioBean.registrar}"
                                         styleClass="btn-skyway-register w-100" update=":growl @form"/>
                    </div>

                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
