<?xml version="1.0" encoding="UTF-8"?>
<ui:composition lang="es"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="/template/main.xhtml">

    <ui:define name="head">
        <title>SkyWay | Registro de Usuario</title>
        <style type="text/css">
            /* ==========================================================================
               🎨 ESTILOS DARK THEME CORPORATIVO SKYWAY - REGISTRO TUNED
               ========================================================================== */
            :root {
                --sky-bg-dark: #090E1A;
                --sky-card-bg: #0F172A;
                --sky-input-bg: #1E293B;
                --sky-border: rgba(255, 255, 255, 0.12);
                --sky-blue: #38BDF8;
                --navy-brand: #2563EB;
                --navy-hover: #1D4ED8;
                --text-heading: #F8FAFC;
                --text-muted: #94A3B8;
            }

            .register-container {
                max-width: 880px;
                margin: 40px auto;
                background: var(--sky-card-bg) !important;
                border: 1px solid var(--sky-border) !important;
                border-radius: 16px !important;
                padding: 36px !important;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
            }

            .register-title {
                color: var(--text-heading) !important;
                font-size: 1.5rem !important;
                font-weight: 800 !important;
                margin-bottom: 24px !important;
                border-bottom: 1px solid var(--sky-border) !important;
                padding-bottom: 14px !important;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .section-header {
                color: var(--sky-blue) !important;
                font-size: 0.78rem !important;
                font-weight: 800 !important;
                text-transform: uppercase !important;
                letter-spacing: 0.05em !important;
                margin-top: 22px !important;
                margin-bottom: 14px !important;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .skyway-field-group {
                margin-bottom: 16px;
            }

            .skyway-label {
                display: block !important;
                color: var(--text-muted) !important;
                font-size: 0.78rem !important;
                font-weight: 700 !important;
                text-transform: uppercase !important;
                letter-spacing: 0.03em !important;
                margin-bottom: 6px !important;
            }

            .register-container .ui-inputfield,
            .register-container .ui-selectonemenu {
                background: var(--sky-input-bg) !important;
                border: 1px solid var(--sky-border) !important;
                color: var(--text-heading) !important;
                border-radius: 8px !important;
                padding: 10px 14px !important;
                width: 100% !important;
                font-size: 0.88rem !important;
            }

            .register-container .ui-inputfield:focus,
            .register-container .ui-selectonemenu:focus-within {
                border-color: var(--sky-blue) !important;
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.25) !important;
            }

            /* Botón Principal */
            .btn-skyway-register.ui-button {
                background: linear-gradient(135deg, #2563EB, #0284C7) !important;
                border: none !important;
                color: #FFFFFF !important;
                font-weight: 800 !important;
                padding: 14px !important;
                font-size: 1rem !important;
                border-radius: 10px !important;
                box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35) !important;
                transition: transform 0.2s ease, box-shadow 0.2s ease !important;
            }

            .btn-skyway-register.ui-button:hover {
                background: linear-gradient(135deg, #1D4ED8, #0369A1) !important;
                transform: translateY(-1px);
            }

            /* ==========================================================================
               🛠️ CALENDARIO POPUP TUNED (DATEPICKER)
               ========================================================================== */
            body .ui-datepicker {
                background-color: #0F172A !important;
                border: 1px solid rgba(56, 189, 248, 0.3) !important;
                border-radius: 12px !important;
                color: #F8FAFC !important;
                padding: 12px !important;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7) !important;
            }

            body .ui-datepicker .ui-datepicker-header {
                background-color: #090E1A !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
                padding: 8px !important;
                border-radius: 8px !important;
            }

            body .ui-datepicker .ui-datepicker-title select {
                background-color: #1E293B !important;
                color: #38BDF8 !important;
                border: 1px solid rgba(56, 189, 248, 0.3) !important;
                border-radius: 6px !important;
                padding: 3px 6px !important;
                font-weight: 700 !important;
            }

            body .ui-datepicker table th {
                color: #38BDF8 !important;
                font-weight: 800 !important;
            }

            body .ui-datepicker table td a {
                color: #CBD5E1 !important;
                border-radius: 6px !important;
                text-align: center !important;
            }

            body .ui-datepicker table td a:hover {
                background-color: #2563EB !important;
                color: #FFFFFF !important;
            }

            body .ui-datepicker table td a.ui-state-active {
                background-color: #38BDF8 !important;
                color: #0F172A !important;
                font-weight: 800 !important;
            }

            /* SELECTONEMENU POPUP */
            body .ui-selectonemenu-panel {
                background-color: #0F172A !important;
                border: 1px solid rgba(255, 255, 255, 0.15) !important;
                border-radius: 8px !important;
            }

            body .ui-selectonemenu-panel .ui-selectonemenu-item {
                color: #CBD5E1 !important;
            }

            body .ui-selectonemenu-panel .ui-selectonemenu-item:hover,
            body .ui-selectonemenu-panel .ui-selectonemenu-item.ui-state-highlight {
                background-color: #2563EB !important;
                color: #FFFFFF !important;
            }
        </style>
    </ui:define>

    <ui:define name="contenido">
        <p:growl id="growl" showDetail="true" keepAlive="true" life="5000" />

        <div class="container">
            <div class="register-container">
                <div class="register-title">
                    <i class="pi pi-user-plus text-blue-400"></i>
                    Crear Cuenta de Pasajero
                </div>

                <h:form id="registroForm">

                    <!-- SECCIÓN 1: DATOS PERSONALES -->
                    <div class="section-header">
                        <i class="pi pi-id-card"></i> Información Personal y Acceso
                    </div>

                    <div class="row g-3">
                        <!-- RUT -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="rutUsuario" value="RUT / Identificador de Cuenta" styleClass="skyway-label"/>
                            <p:inputText id="rutUsuario" value="#{usuarioBean.usuario.rut}" required="true"
                                         requiredMessage="El RUT es obligatorio"
                                         placeholder="Ej: 12345678-9"/>
                        </div>

                        <!-- Nombre -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="nombre" value="Nombre" styleClass="skyway-label"/>
                            <p:inputText id="nombre" value="#{usuarioBean.usuario.nombre}" required="true"
                                         requiredMessage="El nombre es obligatorio"
                                         placeholder="Ej: Cristóbal"/>
                        </div>

                        <!-- Apellido -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="apellido" value="Apellido" styleClass="skyway-label"/>
                            <p:inputText id="apellido" value="#{usuarioBean.usuario.apellido}" required="true"
                                         requiredMessage="El apellido es obligatorio"
                                         placeholder="Ej: Román"/>
                        </div>

                        <!-- Fecha Nacimiento (DatePicker Tuned con Mayoría de Edad) -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="fechaNacimiento" value="Fecha de Nacimiento" styleClass="skyway-label"/>
                            <p:datePicker id="fechaNacimiento"
                                          value="#{usuarioBean.usuario.fechaNacimiento}"
                                          pattern="dd/MM/yyyy"
                                          mask="true"
                                          monthNavigator="true"
                                          yearNavigator="true"
                                          yearRange="c-100:c-18"
                                          maxdate="#{usuarioBean.fechaMaxMayorEdad}"
                                          showIcon="true"
                                          showButtonBar="true"
                                          placeholder="DD/MM/AAAA"
                                          required="true"
                                          requiredMessage="La fecha de nacimiento es obligatoria"/>
                        </div>

                        <!-- Correo Electrónico -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="correoElectronico" value="Correo Electrónico" styleClass="skyway-label"/>
                            <p:inputText id="correoElectronico" value="#{usuarioBean.usuario.correoElectronico}" required="true"
                                         requiredMessage="El correo electrónico es obligatorio"
                                         placeholder="ejemplo@correo.cl"/>
                        </div>

                        <!-- Teléfono Móvil (Chile) -->
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="telefono" value="Teléfono Móvil (Chile)" styleClass="skyway-label"/>
                            <p:inputMask id="telefono" mask="+56 9 9999 9999" value="#{usuarioBean.usuario.telefono}"
                                         required="true" requiredMessage="El teléfono es obligatorio"
                                         placeholder="+56 9 1234 5678"/>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: DOCUMENTACIÓN Y NACIONALIDAD -->
                    <div class="section-header">
                        <i class="pi pi-globe"></i> Documento de Viaje y Nacionalidad
                    </div>

                    <div class="row g-3">
                        <!-- Tipo de Documento -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="tipoDocumento" value="Tipo Documento" styleClass="skyway-label"/>
                            <p:selectOneMenu id="tipoDocumento" value="#{usuarioBean.tipoDocumento}" required="true"
                                             requiredMessage="Seleccione el tipo de documento">
                                <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                <f:selectItem itemLabel="Cédula de Identidad" itemValue="CEDULA"/>
                                <f:selectItem itemLabel="Pasaporte" itemValue="PASAPORTE"/>
                                <f:selectItem itemLabel="DNI Extranjero" itemValue="DNI"/>
                            </p:selectOneMenu>
                        </div>

                        <!-- Número de Documento / Pasaporte -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="documentoIdentidad" value="Número de Documento" styleClass="skyway-label"/>
                            <p:inputText id="documentoIdentidad" value="#{usuarioBean.usuario.documentoIdentidad}" required="true"
                                         requiredMessage="El número de documento es obligatorio"
                                         placeholder="Ej: 12345678-9 o A1234567"/>
                        </div>

                        <!-- Nacionalidad -->
                        <div class="col-md-4 skyway-field-group">
                            <p:outputLabel for="nacionalidad" value="Nacionalidad" styleClass="skyway-label"/>
                            <p:selectOneMenu id="nacionalidad" value="#{usuarioBean.nacionalidad}" required="true"
                                             filter="true" filterMatchMode="contains"
                                             requiredMessage="Seleccione una nacionalidad">
                                <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                <f:selectItem itemLabel="Chilena" itemValue="Chilena"/>
                                <f:selectItem itemLabel="Argentina" itemValue="Argentina"/>
                                <f:selectItem itemLabel="Peruana" itemValue="Peruana"/>
                                <f:selectItem itemLabel="Colombiana" itemValue="Colombiana"/>
                                <f:selectItem itemLabel="Brasilera" itemValue="Brasilera"/>
                                <f:selectItem itemLabel="Uruguaya" itemValue="Uruguaya"/>
                                <f:selectItem itemLabel="Boliviana" itemValue="Boliviana"/>
                                <f:selectItem itemLabel="Ecuatoriana" itemValue="Ecuatoriana"/>
                                <f:selectItem itemLabel="Venezolana" itemValue="Venezolana"/>
                                <f:selectItem itemLabel="Española" itemValue="Española"/>
                                <f:selectItem itemLabel="Estadounidense" itemValue="Estadounidense"/>
                                <f:selectItem itemLabel="Mexicana" itemValue="Mexicana"/>
                                <f:selectItem itemLabel="Otra" itemValue="Otra"/>
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: SEGURIDAD -->
                    <div class="section-header">
                        <i class="pi pi-lock"></i> Seguridad y Acceso
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="contrasena" value="Contraseña" styleClass="skyway-label"/>
                            <p:password id="contrasena" value="#{usuarioBean.usuario.contrasena}" required="true"
                                        toggleMask="true" requiredMessage="La contraseña es obligatoria"
                                        placeholder="••••••••"/>
                        </div>

                        <div class="col-md-6 skyway-field-group">
                            <p:outputLabel for="confirmarContrasena" value="Confirmar Contraseña" styleClass="skyway-label"/>
                            <p:password id="confirmarContrasena" value="#{usuarioBean.confirmarContrasena}" required="true"
                                        toggleMask="true" requiredMessage="Confirma tu contraseña"
                                        placeholder="••••••••"/>
                        </div>
                    </div>

                    <!-- BOTÓN PRINCIPAL -->
                    <div class="mt-4 pt-2">
                        <p:commandButton value="Crear Cuenta de Pasajero" action="#{usuarioBean.registrar}"
                                         icon="pi pi-check-circle"
                                         styleClass="btn-skyway-register w-100" update=":growl @form"/>
                    </div>

                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
