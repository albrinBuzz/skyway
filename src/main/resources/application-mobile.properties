# Perfil complementario de la API móvil.
# Se recomienda activarlo junto con dev o prod, por ejemplo: dev,mobile

skyway.mobile.jwt-secret=${MOBILE_JWT_SECRET:}
skyway.mobile.zone=${MOBILE_ZONE:America/Santiago}
skyway.mobile.allowed-origins=${MOBILE_ALLOWED_ORIGINS:http://localhost:8100,http://127.0.0.1:8100,http://localhost:8101,http://127.0.0.1:8101,http://localhost,https://localhost,capacitor://localhost,https://skyway-gde6a6aza3abb8a6.brazilsouth-01.azurewebsites.net}
skyway.mobile.token-seconds=${MOBILE_TOKEN_SECONDS:7200}

# El listener de correo histórico consulta columnas opcionales (canal/enviada).
# Mantener true si tu esquema las tiene; puede desactivarse con variable de entorno.
skyway.mail-listener.enabled=${SKYWAY_MAIL_LISTENER_ENABLED:false}

server.error.include-message=never
server.error.include-stacktrace=never
