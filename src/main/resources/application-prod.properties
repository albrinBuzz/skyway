# Configuración de conexión a Azure Database for PostgreSQL
spring.datasource.url=jdbc:postgresql://skyway.postgres.database.azure.com:5432/aerolinea_db?sslmode=require
spring.datasource.username=aerolinea_user
spring.datasource.password=qTc31$#C1UNT#B
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=HikariPool-Azure




