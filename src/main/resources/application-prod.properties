# =====================================================================
# CONEXIÓN A AZURE POSTGRESQL (OPTIMIZADA PARA RENDER < 512MB)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://skyway.postgres.database.azure.com:5432/aerolinea_db?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerolinea_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qTc31$#C1UNT#B}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JPA / Hibernate (Sin escaneo pesado en el arranque)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Pool HikariCP Reducido (1 a 2 conexiones ahorran ~60MB de RAM en el proceso)
spring.datasource.hikari.pool-name=HikariPool-Azure
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000