# =====================================================================
# CONFIGURACIÓN DINÁMICA DE BASE DE DATOS (CON FALLBACKS LOCALES)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mantenimiento de Esquema JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP Pool
spring.datasource.hikari.pool-name=HikariPool-SkyWay
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# =====================================================================
# SECRETOS OBLIGATORIOS (sin default: el arranque falla si faltan)
# =====================================================================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:live}
webpay.commerceCode=${WEBPAY_COMMERCE_CODE}
webpay.apiKey=${WEBPAY_API_KEY}
webpay.integration-type=${WEBPAY_INTEGRATION_TYPE}
