# =====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN (SKYWAY)
# =====================================================================
spring.application.name=SkyWay
server.port=${PORT:8080}
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Endpoint de Salud para el Health Check de Render
management.endpoints.web.exposure.include=health
jakarta.faces.NUMBER_OF_VIEWS_IN_SESSION=5
jakarta.faces.NUMBER_OF_LOGICAL_VIEWS=5


# Perfil Activo
spring.profiles.active=prod

# =====================================================================
# MOTOR DE PERSISTENCIA (JPA / HIBERNATE) - AJUSTADO PARA 512MB
# =====================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desactivar validación automática para evitar latencia de red y uso de Metaspace
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# POOL HIKARI REDUCIDO (CRÍTICO: 1 a 3 conexiones ahorran ~100MB de RAM)
spring.datasource.hikari.pool-name=HikariPool-Azure
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false

# =====================================================================
# ENTORNOS DE BASE DE DATOS (Manejados por Perfiles)
