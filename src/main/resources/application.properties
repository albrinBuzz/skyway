# =====================================================================
# CONFIGURACIÓN FRONTEND NATIVO (JSF / PRIMEFACES / WELD)
# =====================================================================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.xhtml
server.error.whitelabel.enabled=true
joinfaces.primefaces.theme=nova-dark

# Aumenta el buffer de renderizado para permitir redirigir si ocurre un error a mitad de página
spring.jpa.open-in-view=true
server.servlet.jsp.init-parameters.jakarta.faces.FACELETS_BUFFER_SIZE=65536

spring.mvc.throw-exception-if-no-handler-found=true
joinfaces.faces.enable-websocket-endpoint=false

# Restringir escaneo de Weld/CDI
joinfaces.weld.scan-classes-limit=5
joinfaces.faces.classpath-scan-packages=com.SkyWay

# Configuración de JSF 4 / Jakarta
jakarta.faces.NUMBER_OF_VIEWS_IN_SESSION=5
jakarta.faces.NUMBER_OF_LOGICAL_VIEWS=5

jakarta.faces.STATE_SAVING_METHOD=client
joinfaces.faces.state-saving-method=client

#jakarta.faces.STATE_SAVING_METHOD=server
#joinfaces.faces.state-saving-method=server



jakarta.faces.PROJECT_STAGE=Production
jakarta.faces.FACELETS_REFRESH_PERIOD=-1


joinfaces.faces.project-stage=Production

# Mensajes de Error de JSF
