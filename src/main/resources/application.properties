# =====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN (SKYWAY)
# =====================================================================
spring.application.name=SkyWay
server.port=${PORT:8080}
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Inicialización diferida (Lazy): Los Beans se cargan bajo demanda
spring.main.lazy-initialization=true
server.servlet.session.persistent=false

# Endpoint de Salud para el Health Check de Render
management.endpoints.web.exposure.include=health

# Perfil Activo
spring.profiles.active=prod
# Opciones: never (defecto), always, when-authorized
# Mostrar componentes (BD, disco, etc.) sin exponer datos sensibles a usuarios anónimos
management.endpoint.health.show-details=always

# Desactivar endpoints no necesarios para ahorrar recursos de escaneo
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.probes.enabled=true
management.health.diskspace.threshold=52428800

# =====================================================================
# MOTOR DE PERSISTENCIA (JPA / HIBERNATE) - AJUSTADO PARA 512MB
# =====================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evitar escaneo DDL y bloquear acceso pesado a metadatos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# POOL HIKARI REDUCIDO (1 a 3 conexiones ahorran ~100MB de RAM)
spring.datasource.hikari.pool-name=HikariPool-Azure
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false

