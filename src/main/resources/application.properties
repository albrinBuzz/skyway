# =====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN (SKYWAY)
# =====================================================================
spring.application.name=SkyWay
server.port=8080
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Perfil Activo: Cambia a "prod" si quieres usar Supabase en la nube
spring.profiles.active=prod

# =====================================================================
# CONFIGURACIÓN INTERNA Y MOTOR DE PERSISTENCIA (JPA / HIBERNATE)
# =====================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pool de Conexiones Hikari (Optimizado para evitar timeouts)
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=false

# =====================================================================
# ENTORNOS DE BASE DE DATOS (Manejados por Perfiles de Spring)
# =====================================================================

# --- PERFIL: LOCAL / DOCKER (dev) ---
# Se activa automáticamente cuando spring.profiles.active = dev
%dev.spring.datasource.url=jdbc:postgresql://skyway_postgres:5432/aerolinea_db?currentSchema=public
%dev.spring.datasource.username=aerolinea_user
%dev.spring.datasource.password=aerolinea_user

# --- PERFIL: REMOTO / NUBE (prod) ---
