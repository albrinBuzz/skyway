# =====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN (SKYWAY)
# =====================================================================
spring.application.name=SkyWay
server.port=${PORT:8080}
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Inicialización diferida (Lazy): Los Beans se cargan bajo demanda


# Perfil Activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,mobile}
spring.main.allow-bean-definition-overriding=true

