# =====================================================================
# CONFIGURACIÓN GENERAL
# =====================================================================
spring.application.name=SkyWay
server.port=${PORT:8080}
spring.main.web-application-type=servlet
server.servlet.context-path=/

# Sesion y cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
# Detras de un proxy TLS: FORWARD_HEADERS_STRATEGY=framework (para que Secure/HSTS funcionen)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Origenes extra para WebSocket (coma). Vacio = mismo origen.
skyway.ws.allowed-origins=${SKYWAY_WS_ALLOWED_ORIGINS:}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod,mobile}
spring.main.allow-bean-definition-overriding=false

# =====================================================================
# FRONTEND NATIVO (JSF / PRIMEFACES)
# =====================================================================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.xhtml
server.error.whitelabel.enabled=false
joinfaces.primefaces.theme=nova-dark
# OSIV desactivado: si alguna vista lanza LazyInitializationException, cargar lo necesario en el servicio (@Transactional / fetch join).
spring.jpa.open-in-view=false

# =====================================================================
# PASARELAS DE PAGO (VARIABLES DINÁMICAS)
# =====================================================================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}

# Sin defaults: application-prod.properties los exige (fail-fast); application-dev.properties trae los de TEST publicos.
webpay.commerceCode=${WEBPAY_COMMERCE_CODE:}
webpay.apiKey=${WEBPAY_API_KEY:}
webpay.integration-type=${WEBPAY_INTEGRATION_TYPE:TEST}
webpay.return-path=/webpay/commit

# =====================================================================
# SERVICIO MENSAJERÍA (GMAIL SMTP)
# =====================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================================
# BASE DE DATOS POSTGRESQL
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aerolinea_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aerolinea_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP Pool
spring.datasource.hikari.pool-name=HikariPool-SkyWay
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000