<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Estadísticas</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="#">Panel de Control</a></li>
            <li><a href="#">Vuelos</a></li>
            <li><a href="#">Aviones</a></li>
            <li><a href="#">Pilotos</a></li>
            <li><a href="#">Reportes</a></li>
        </ul>
    </div>

    <!-- Contenido Principal -->
    <div class="content">
        <h2>Reportes y Estadísticas</h2>

        <!-- Reportes Generales -->
        <div class="card">
            <div class="card-header">
                <h3>Estadísticas Generales</h3>
            </div>
            <div class="card-body">
                <canvas id="graficoEstadisticasGenerales"></canvas>
            </div>
        </div>

        <script>
            var ctx = document.getElementById('graficoEstadisticasGenerales').getContext('2d');
            var graficoEstadisticasGenerales = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Vuelos Completados', 'Vuelos Cancelados', 'Vuelos Retrasados'],
                    datasets: [{
                        label: 'Número de Vuelos',
                        data: [200, 30, 15],
                        backgroundColor: '#2196F3',
                        borderColor: '#0b79d0',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        </script>

        <!-- Reportes de Aviones -->
        <div class="card mt-4">
            <div class="card-header">
                <h3>Estadísticas de Aviones</h3>
            </div>
            <div class="card-body">
                <canvas id="graficoAviones"></canvas>
            </div>
        </div>

        <script>
            var ctx2 = document.getElementById('graficoAviones').getContext('2d');
            var graficoAviones = new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ['Aviones en Servicio', 'Aviones en Mantenimiento', 'Aviones Retirados'],
                    datasets: [{
                        data: [50, 10, 5],
                        backgroundColor: ['#4CAF50', '#FFEB3B', '#F44336'],
                    }]
                }
            });
        </script>

        <!-- Reportes de Pilotos -->
        <div class="card mt-4">
            <div class="card-header">
                <h3>Estadísticas de Pilotos</h3>
            </div>
            <div class="card-body">
                <canvas id="graficoPilotos"></canvas>
            </div>
        </div>

        <script>
            var ctx3 = document.getElementById('graficoPilotos').getContext('2d');
            var graficoPilotos = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: ['Pilotos Activos', 'Pilotos Inactivos'],
                    datasets: [{
                        label: 'Número de Pilotos',
                        data: [40, 5],
                        backgroundColor: '#FFC107',
                        borderColor: '#f7b801',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        </script>

    </div>
</body>
</html>
