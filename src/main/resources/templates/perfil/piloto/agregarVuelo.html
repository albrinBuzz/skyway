<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Travela - Añadir Vuelo</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <link rel="icon" th:href="@{/img/Spring.jpg}" type="image/png">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    
    <style type="text/css">
        body {
            position: relative;
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7fc;
            color: #333;
        }

        .container {
            margin-top: 4rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #007bff;
        }

        hr {
            border-top: 1px solid #eee;
            margin: 1rem 0;
        }

        .panel-heading {
            background-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
        }

        .panel-body {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 0 0 4px 4px;
        }

        .form-group label {
            font-weight: bold;
            color: #555;
        }

        .form-control {
            border-radius: 0.25rem;
            box-shadow: none;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .price-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
        }

        .price-input {
            background-color: #f8f9fa;
            font-weight: 500;
            border-radius: 0.25rem;
        }

        .row {
            margin-top: 20px;
        }

        .col-sm-4 {
            padding: 15px;
        }

        .panel-title {
            font-size: 1.2rem;
            color: #007bff;
            margin-bottom: 15px;
        }

        .submit-btn {
            text-align: center;
            margin-top: 20px;
        }

        .submit-btn button {
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn button:hover {
            background-color: #218838;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #007bff;
            color: #fff;
            padding: 10px;
            border-radius: 50%;
            display: none;
            cursor: pointer;
        }

        .back-to-top:hover {
            background-color: #0056b3;
        }

    </style>

</head>

<body>

    <!-- Header Insert -->
    <header th:insert="~{home/homeTemplate/home.html::header}"></header>

    <!-- Main Content - Add Flight Form -->
    <div class="container">
        <h2>Añadir Nuevo Vuelo</h2>
        <hr>

        <!-- Flight Information Form -->
        <form th;action="@{/perfil/agregarVuelo}" method="post" th:object="${vuelo}" class="form-horizontal">

            <!-- Flight Information Panel -->
            <div class="panel-group">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <legend>Información del Vuelo</legend>
                    </div>
                    <div class="panel-body">
                        
                        <!-- Número de Vuelo -->
                        <div class="form-group">
                            <label for="numeroVuelo">Número de Vuelo:</label>
                            <input type="text" id="numeroVuelo" name="numeroVuelo" class="form-control" placeholder="Número de Vuelo" required>
                        </div>

                   			
                   			<div class="form-group">
							    <label for="fechaHoraSalida">Fecha y Hora de Salida:</label>
							    <input type="datetime-local" id="fechaHoraSalida" name="fechaHoraSalida" th:field="*{fechaHoraSalida}" class="form-control" required>
							</div>
							
							<div class="form-group">
							    <label for="fechaHoraLlegada">Fecha y Hora de Llegada:</label>
							    <input type="datetime-local" id="fechaHoraLlegada" name="fechaHoraLlegada" th:field="*{fechaHoraLlegada}" class="form-control" required>
							</div>
							                   			

                     		
                     		<div class="form-group">
							    <label for="aeropuertoSalida">Aeropuerto de Salida:</label>
							    <select id="aeropuertoSalida" name="aeropuertoSalida" th:field="*{aeropuerto1}" class="form-control" required>
							        <option th:each="aeropuerto : ${aropuertosSalida}" 
							                th:value="${aeropuerto.idAeropuerto}" 
							                th:text="${aeropuerto.nombreAeropuerto} + ' (' + ${aeropuerto.codigoIata} + ')'" >
							        </option>
							    </select>
							</div>
							
							<div class="form-group">
							    <label for="aeropuertoLlegada">Aeropuerto de Llegada:</label>
							    <select id="aeropuertoLlegada" name="aeropuertoLlegada" th:field="*{aeropuerto2}" class="form-control" required>
							        <option th:each="aeropuerto : ${aropuertosLlegada}" 
							                th:value="${aeropuerto.idAeropuerto}" 
							                th:text="${aeropuerto.nombreAeropuerto} + ' (' + ${aeropuerto.codigoIata} + ')'" >
							        </option>
							    </select>
							</div>
							                     		

                        <!-- Precio del Vuelo -->
                        <div class="form-group">
                            <label for="precioVuelo">Precio del Vuelo:</label>
                            <input type="number" id="precioVuelo" name="precioVuelo"  th:field="*{precio}"  class="form-control" min="0" required>
                        </div>

                        <!-- Avión -->
                        <div class="form-group">
                            <label for="avion">Seleccionar Avión:</label>
                            <select id="avion" name="avion" class="form-control" required>
                                <!-- Aquí irán las opciones cargadas desde la base de datos -->
                               <option  th:each="avion : ${aviones}" th:text="${avion.modelo}+' '+${avion.fabricante}+' '+${avion.numeroDeRegistro}" th:value="${avion.idAvion}"></option>
                            </select>
                        </div>

                        <!-- Piloto -->
                        <div class="form-group">
                            <label for="piloto">Seleccionar Piloto:</label>
                            <select id="piloto" name="piloto" class="form-control" th:field="*{piloto}" required>
                                <!-- Aquí irán las opciones cargadas desde la base de datos -->
                                <option  th:each=" piloto : ${pilotos}" th:text="${piloto.nombre}+' '+${piloto.apellido}+' / '+${piloto.rutUsuario}" th:value=${piloto.rutUsuario}></option>
                     
                            </select>
                        </div>

                        <!-- Estado del Vuelo -->
                   		<div class="form-group">
						    <label for="estadoVuelo">Estado del Vuelo:</label>
						    <select id="estadoVuelo" name="estadoVuelo" class="form-control" th:field="*{estadoVuelo}"  required>
						        <option value="" disabled selected>Seleccione el estado del vuelo</option>
						        <option th:each="estado : ${estadoVuelos}"
						                th:value="${estado.idEstadoVuelo}" 
						                th:text="${estado.estado}">Estado del Vuelo</option>
						    </select>
						</div>
                   		
                        <!-- Clases de Asiento y Precios -->
                        <div class="row">
                         	
                         	<!-- Clase Primera -->
<div class="col-sm-4">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h4 class="panel-title">Primera Clase</h4>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label>Asientos</label>
                <input type="number" id="asientosPrimera" class="form-control" value="0" min="0" name="asientosPrimera" readonly required>
            </div>
            <div class="input-group">
                <label class="price-label">Precio <small>(por asiento)</small></label>
                <input type="number" id="precioPrimera" class="form-control price-input" value="0" min="0" name="precioPrimera" required>
            </div>
        </div>
    </div>
</div>

<!-- Clase Ejecutiva -->
<div class="col-sm-4">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h4 class="panel-title">Clase Ejecutiva</h4>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label>Asientos</label>
                <input type="number" id="asientosEjecutiva" class="form-control" value="0" min="0" name="asientosEjecutiva" readonly required>
            </div>
            <div class="input-group">
                <label class="price-label">Precio <small>(por asiento)</small></label>
                <input type="number" id="precioEjecutiva" class="form-control price-input" value="0" min="0" name="precioEjecutiva" required>
            </div>
        </div>
    </div>
</div>

<!-- Clase Económica -->
<div class="col-sm-4">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h4 class="panel-title">Clase Económica</h4>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label>Asientos</label>
                <input type="number" id="asientosEconomica" class="form-control" value="0" min="0" name="asientosEconomica" readonly required>
            </div>
            <div class="input-group">
                <label class="price-label">Precio <small>(por asiento)</small></label>
                <input type="number" id="precioEconomica" class="form-control price-input" value="0" min="0" name="precioEconomica" required>
            </div>
        </div>
    </div>
</div>

<!-- Detalles del avión -->
<div id="avionDetails"></div>
                         	
                         	
                        </div>

                        <!-- Botón de Enviar -->
                        <div class="submit-btn">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-plus"></i> Añadir Vuelo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer Insert -->
    <footer th:insert="~{home/homeTemplate/home.html::footer}"></footer>

    <a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top">
        <i class="fa fa-arrow-up"></i>
    </a>

    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Template Javascript -->
    <script src="js/main.js"></script>
    
<script th:inline="javascript">

document.addEventListener("DOMContentLoaded", function() {
    const avionSelect = document.getElementById('avion');

    avionSelect.addEventListener('change', function() {
        const avionId = avionSelect.value;
            avionId.avionId
        // Si se selecciona un avión
        if (avionId) {
            // Hacer la solicitud AJAX al servidor Spring Boot para obtener los detalles del avión
            fetch(`/avion/getAvion/${avionId}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())  // Convertir la respuesta en JSON
            .then(data => {
                if (data) {

                    // Actualizar las clases y precios en el formulario
                    document.getElementById('asientosPrimera').value = data.cap_primera;
                    document.getElementById('precioPrimera').value = data.precioPrimera;

                    document.getElementById('asientosEjecutiva').value = data.cap_ejecutiva;
                    document.getElementById('precioEjecutiva').value = data.precioEjecutiva;

                    document.getElementById('asientosEconomica').value = data.cap_economica;
                    document.getElementById('precioEconomica').value = data.precioEconomica;
                } else {
                    // Si no se encuentra el avión, mostrar un mensaje
                    document.getElementById('avionDetails').innerHTML = "<p>Detalles no disponibles para el avión seleccionado.</p>";
                }
            })
            .catch(error => {
                console.error('Error al obtener detalles del avión:', error);
                document.getElementById('avionDetails').innerHTML = "<p>Ocurrió un error al obtener los detalles.</p>";
            });
        } else {
            // Si no se selecciona un avión, limpiar los detalles
            document.getElementById('avionDetails').innerHTML = "";
            document.getElementById('asientosPrimera').value = "";
            document.getElementById('precioPrimera').value = "";

            document.getElementById('asientosEjecutiva').value = "";
            document.getElementById('precioEjecutiva').value = "";

            document.getElementById('asientosEconomica').value = "";
            document.getElementById('precioEconomica').value = "";
        }
    });
});
</script>

</body>

</html>
